<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>联机 Demo</title>

<!--
  认领用。把 content 换成认领页给你的 nonce，保存发布，然后回去点「开始验证」。
  认领完成后这行可以删掉 —— 它只在认领那一刻被读一次。
-->
<meta name="xmeta-verify" content="PUT_NONCE_HERE">

<link rel="stylesheet" href="xmeta-ui.css">
<script src="//s1.hdslb.com/bfs/seed/toy/app/sdk/toy-sdk.js"></script>
<script src="https://www.oxth.com:8443/xmeta-client.js"></script>
</head>
<body class="xm">
<div class="xm-page">

  <div class="xm-hero" style="text-align:left">
    <p class="xm-kicker">xmeta 联机</p>
    <h1 class="xm-display">联机 Demo</h1>
    <p class="xm-body xm-mt" style="margin-top:6px">一个最小的第三方 toy，用来验证 xmeta 身份桥。</p>
  </div>

  <!-- 没配 client_id 时的接入指引 -->
  <div class="xm-alert xm-alert--warn xm-hidden xm-mt-lg" id="cfgWarn">
    <b>还没配置 client_id</b> —— 需要先认领这款 toy：
    <ol style="margin:8px 0 0;padding-left:18px">
      <li>打开中心 toy xmeta 的「认领 toy」页</li>
      <li>填入本 toy 的 slug，拿到验证码</li>
      <li>把验证码填到本文件顶部的 meta 里，保存发布</li>
      <li>回到认领页点「开始验证」，拿到 client_id</li>
      <li>把 client_id 填到下方 <span class="xm-mono">CONFIG.clientId</span>，再次发布</li>
    </ol>
  </div>

  <div class="xm-card xm-mt-lg xm-rise">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px">
      <span class="xm-label" style="margin:0">联机状态</span>
      <span class="xm-live" id="vState">未连接</span>
    </div>
    <div class="xm-kv xm-hidden" id="rowUid">
      <span class="xm-kv__k">身份 uid</span>
      <span class="xm-kv__v xm-mono" id="vUid">—</span>
    </div>
    <div class="xm-kv xm-hidden" id="rowLeft">
      <span class="xm-kv__k">有效期</span>
      <span class="xm-kv__v" id="vLeft">—</span>
    </div>
  </div>

  <div class="xm-actions xm-mt-lg">
    <button class="xm-btn xm-btn--primary" id="btnLogin">开启联机</button>
    <button class="xm-btn xm-btn--primary xm-hidden" id="btnFinish">完成登录</button>
  </div>
  <div class="xm-actions" style="margin-top:8px">
    <button class="xm-btn xm-btn--quiet xm-btn--sm" id="btnReset">清除凭证（本地 + 云端）</button>
  </div>

  <p class="xm-small xm-mt" id="tip"></p>
  <p class="xm-small xm-mt xm-mono" id="diag" style="color:var(--xm-ink-3);word-break:break-all"></p>

  <div class="xm-alert xm-alert--error xm-hidden xm-mt-lg" id="errBox"></div>

  <div class="xm-foot">
    <span class="xm-brand"><span class="xm-brand__dot"></span>xmeta 身份服务</span>
  </div>
</div>

<script>
// ─────────────────────────────────────────────
// 配置：认领拿到 client_id 后填到这里
// ─────────────────────────────────────────────
const CONFIG = {
  apiBase:       'https://www.oxth.com:8443',
  centerToySlug: 'xmeta',
  clientId:      'xmeta_v8lTN7_zee7Kv11TxkN7BQ'
}

const $ = (id) => document.getElementById(id)

function showErr(msg) { $('errBox').textContent = msg; $('errBox').classList.remove('xm-hidden') }
function clearErr() { $('errBox').classList.add('xm-hidden') }

// ── 开启联机（必须在用户手势里调用，toy.navigate 需要手势）──
$('btnLogin').addEventListener('click', async () => {
  clearErr()
  $('btnLogin').disabled = true
  try {
    await XMETA.login()
    // 成功的话页面就被跳走了，这行不会执行到
  } catch (e) {
    showErr('开启失败：' + (e.message || e))
    $('btnLogin').disabled = false
  }
})

// ── 完成登录（从中心 toy 跳回来之后）──
//
// SDK 不会自动兑换授权码 —— 原因见 xmeta-client.js 头部：过桥是「跳走再
// 跳回来」，跳走时那个页面实例还在后台跑，自动兑换会让它抢在用户看得见的
// 这个页面之前把一次性 code 消费掉，表现就是「第一次回来显示未连接」。
//
// 所以兑换绑在用户手势上：只有用户点得到的页面能触发它。
const TERMINAL_ERRORS = ['code_expired', 'code_used', 'invalid_code', 'no_pending_code', 'no_pkce_record']

$('btnFinish').addEventListener('click', async () => {
  clearErr()
  const btn = $('btnFinish')
  btn.disabled = true
  try {
    await XMETA.completeLogin()
  } catch (e) {
    showErr('完成登录失败：' + (e.message || e))
    // 这枚码已经确定没用了，把按钮收起来，别让人反复点一个必然失败的按钮。
    // 网络抖动之类的可重试错误则留着按钮 —— 授权码还在槽里。
    if (TERMINAL_ERRORS.indexOf(e.code) >= 0) btn.classList.add('xm-hidden')
  } finally {
    btn.disabled = false
  }
})

// ── 清除凭证（调试用）──
//
// 两份都得清，缺一个就会「看起来没清干净」：
//   XMETA.logout()            本地那份：会话 + PKCE 记录 + 待兑换的码
//   removeCloudStorage        云端那份：跨设备恢复全靠它，不清的话
//                             下次进来又被恢复成「已连接」
$('btnReset').addEventListener('click', async () => {
  clearErr()
  $('tip').textContent = ''

  if (typeof XMETA !== 'undefined') XMETA.logout()
  else console.warn('[demo] XMETA 没加载，只清云端')

  cloudToken = null
  try {
    await toy.removeCloudStorage([CLOUD_KEY])
    $('tip').textContent = '本地和云端的凭证都已清除，可以重新走一遍了。'
  } catch (e) {
    // 没登录 / 限流 / 抖动都会走这里。本地那份已经清了，说清楚就行。
    console.warn('[demo] 清除云存储失败：', e)
    showErr('本地已清除，但云端那份没清掉：' + (e.message || e))
  }
  paintDiag()
})



// ── 剩余时间 ──
// 用户自己选的时长，过期后要回中心 toy 再授权一次。把它显示出来，
// 别让人玩到一半突然掉线还不知道为什么。
let countdown = null

function fmtLeft(ms) {
  const s = Math.floor(ms / 1000)
  const h = Math.floor(s / 3600)
  const m = Math.floor((s % 3600) / 60)
  if (h > 0) return h + ' 小时 ' + m + ' 分'
  if (m > 0) return m + ' 分 ' + (s % 60) + ' 秒'
  return (s % 60) + ' 秒'
}

/**
 * 未连接。两种来路：手上压根没有凭证，或者凭证已经过期 ——
 * 都得回中心 toy 重新申请一次，没有静默续期的路子。
 * btnText 区分这两者，文案上更好懂一点。
 */
function paintDisconnected(btnText) {
  if (countdown) { clearInterval(countdown); countdown = null }
  $('vState').textContent = '未连接'
  $('vState').className = 'xm-live'
  $('rowUid').classList.add('xm-hidden')
  $('rowLeft').classList.add('xm-hidden')
  $('btnFinish').classList.add('xm-hidden')
  $('btnLogin').textContent = btnText || '开启联机'
}

function startCountdown() {
  if (countdown) clearInterval(countdown)
  $('rowLeft').classList.remove('xm-hidden')
  const tick = () => {
    const ms = XMETA.getRemainingMs()
    if (ms <= 0) {
      // 有效期为 0 就等于没身份了，回到未连接，让玩家重新申请
      paintDisconnected('重新获取')
      return
    }
    $('vLeft').textContent = '还剩 ' + fmtLeft(ms)
  }
  tick()
  countdown = setInterval(tick, 1000)
}

// ── 联机状态 = 本 toy 云存储里那枚 access_token ──
//
// 为什么用云存储而不是 localStorage：云存储按「登录用户 + toy」双维度
// 隔离，跟着登录态跨设备走。localStorage 只按**源**隔离，而所有 toy 的
// 内层 iframe 同在 www.bilibilitoy.com 一个源下 —— 同源的别的 toy
// 只要知道你的 clientId（它是公开的）就能读走你存在那里的凭证。
//
// 两条平台约束必须守住（SDK 文档「频率限制与最佳实践」）：
//   1. 额度是**整个 toy 的所有玩家共享**的，所以当凭证存、别当内存用。
//      这里只在「手上的 token 和云端那份不一样」时才写，页面加载读一次。
//   2. value ≤1024 字节。本服务的 token 实测 ~380 字节，留个保险。
const CLOUD_KEY = 'xmeta_access_token'
const CLOUD_VALUE_MAX = 1024

let cloudToken = null
/** 首次读取的落地信号：同步的落盘要先等它，才知道云端是不是已经有同一份 */
let cloudReady = Promise.resolve()

if (typeof toy !== 'undefined') {
  cloudReady = toy.getCloudStorage([CLOUD_KEY])
    .then((store) => { cloudToken = store[CLOUD_KEY] || null })
    .catch((e) => {
      // 没登录 / 限流 / 抖动都会走这里。读不到按「没有」处理，不打扰玩家
      console.warn('[demo] 读取云存储失败：', e)
      cloudToken = null
    })
}

/** 新拿到的 token 落盘。失败不抛 —— 退化成「只有本机有」而已 */
async function syncCloudToken(jwt) {
  await cloudReady
  if (jwt === cloudToken) return          // 云端就是这份，别再消耗额度
  if (jwt.length > CLOUD_VALUE_MAX) {
    console.warn('[demo] token 超过云存储单值上限，未写入')
    return
  }
  try {
    await toy.setCloudStorage({ [CLOUD_KEY]: jwt })
    cloudToken = jwt
    console.log('[demo] access_token 已写入本 toy 的云存储')
  } catch (e) {
    if (e && e.type === 'http_error' && e.code === 307044) {
      // 额度是同一个 toy 的所有玩家共用的，人多就容易撞上
      console.warn('[demo] 云存储被限流，稍后再试')
    } else {
      console.warn('[demo] 写入云存储失败：', e)
    }
  }
}

let configured = false

if (!CONFIG.clientId || CONFIG.clientId === 'PUT_CLIENT_ID_HERE') {
  $('cfgWarn').classList.remove('xm-hidden')
  $('btnLogin').disabled = true
} else {
  if (typeof XMETA === 'undefined') {
    // xmeta-client.js 是从中心服务器加载的，服务器挂了就拿不到 XMETA。
    // 此时联机功能不可用，但 toy 本身还能跑，别把整个页面搞崩。
    showErr('xmeta 服务暂时不可用，联机功能无法初始化。请稍后重试。')
    $('btnLogin').disabled = true
  } else {
    try {
      XMETA.configure(CONFIG)
      configured = true
      $('tip').textContent = '点「开启联机」跳到中心 toy 完成一次授权；跳回来之后再点一次「完成登录」。'
    } catch (e) {
      showErr('初始化失败：' + e.message)
      $('btnLogin').disabled = true
    }
  }
}

if (configured) {
  // 回跳之后 xmeta-client.js 会自动用 code 换 JWT，换好了通知这里
  XMETA.onSession((s) => {
    if (!s) return paintDisconnected('开启联机')   // 被 logout() 或彻底失效
    $('vState').textContent = '已连接'
    $('vState').className = 'xm-live xm-live--on'
    if (s.uid) { $('vUid').textContent = s.uid; $('rowUid').classList.remove('xm-hidden') }
    $('btnLogin').textContent = '重新获取'
    $('btnFinish').classList.add('xm-hidden')   // 已经连上了，那个按钮没用了
    $('tip').textContent = ''
    startCountdown()
    // 拿到（或从本机恢复出）身份后，把 token 写进本 toy 的云存储 ——
    // 那才是「联机状态」的落点。不 await：写失败不该影响玩。
    syncCloudToken(s.jwt)
  })

  // 检测到待兑换的授权码 —— SDK 只负责通知，兑换等用户点。
  //
  // 先确认 SDK 是新版：它是从中心服务器分发的，改了仓库没重启服务端的话
  // 这里拿到的是旧脚本。旧脚本没有 onCodeReady，按钮永远不会出现 ——
  // 而且如果不拦一下，下面那行会抛 TypeError，把后面的注册全带走，
  // 界面上什么都不显示，极难排查。
  if (typeof XMETA.onCodeReady !== 'function') {
    showErr('xmeta-client.js 还是旧版本（没有 onCodeReady）。' +
      '需要先部署服务端并重启，或强制刷新页面。')
    $('btnLogin').disabled = true
  } else {
    XMETA.onCodeReady(() => {
      $('btnFinish').classList.remove('xm-hidden')
      $('tip').textContent = '授权已返回，点「完成登录」就好。'
      paintDiag()
    })
  }

  // 成功时把错误清掉。否则前面某条路失败留下的报错会一直挂在那里，
  // 用户明明已经拿到身份了，界面上却还有个红字 —— 看起来像坏了。
  XMETA.onSession(() => { clearErr(); paintDiag() })

  // 云存储里那枚 token 就是联机状态本身：
  //   有效 → 装进 XMETA，直接「已连接」，不用再过一次桥；
  //   过期 / 解不开 → 清掉，维持「未连接」，等玩家重新申请一次。
  //
  // 换个设备打开走的也是这条路，所以云存储里的凭证才是跨设备的那个真身，
  // localStorage 只是这台设备上的快取。
  cloudReady.then(() => {
    if (!cloudToken) return
    if (XMETA.setSession(cloudToken)) {
      $('tip').textContent = '已用本 toy 云存储里的凭证恢复联机，不用重新授权。'
    } else {
      cloudToken = null
      toy.removeCloudStorage([CLOUD_KEY]).catch(() => { /* 清不掉也没关系 */ })
    }
  })
}

// ── 诊断：没连上时把现场摊开 ──
//
// 这条链路里好几处失败是**静默**的 —— SDK 只 console.warn，界面上就一句
// 「未连接」。不摊开的话，出了问题只能靠猜（或者让人去翻控制台）。
// 只在未连接时显示，连上了自动消失。
const DIAG_KEYS = [
  // 中心 toy 自己写的版本号。它在上传的 HTML 里、不是服务端分发的，
  // 「上传生效没有」没法用 curl 查 —— 看这个数字最快。
  ['bridge', 'xmeta:bridge'],
  ['req', 'xmeta:req'],                          // 本次请求（claimed 才是被中心 toy 接手过）
  ['code', 'xmeta:code'],                        // 中心 toy 写下的待兑换授权码
  // 旧格式的槽。中心 toy 过渡期会双写它 —— 所以 "legacy=有 而 code=无"
  // 就说明线上跑的 bridge.html 还是旧版（没写新键）。
  ['legacy', 'xmeta:res'],
  ['pkce', 'xmeta:pkce:' + CONFIG.clientId],     // 本地 PKCE 记录，兑换全靠它
  ['sess', 'xmeta:sess:' + CONFIG.clientId]      // 已保存的会话
]

function paintDiag() {
  const el = $('diag')
  if (!el) return
  if (typeof XMETA !== 'undefined' && XMETA.getSession()) { el.textContent = ''; return }

  const parts = DIAG_KEYS.map(([name, key]) => {
    let v = '?'
    try { v = localStorage.getItem(key) ? '有' : '无' } catch (e) { /* 隐私模式 */ }
    try {
      if (name === 'req') {
        const req = JSON.parse(localStorage.getItem(key) || 'null')
        if (req) v += req.claimed ? '(claimed)' : '(new)'
      }
      if (name === 'bridge') {
        const b = JSON.parse(localStorage.getItem(key) || 'null')
        v = b ? 'v' + b.v : '无'
      }
    } catch (e) { /* 忽略 */ }
    return name + '=' + v
  })
  el.textContent = '诊断：' + parts.join(' · ')
}

// 页面刚加载、兑换刚结束、以及等会话等超时，各采一次
;[2500, 6000, 13000].forEach((t) => setTimeout(paintDiag, t))
</script>
</body>
</html>
