<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>联机 Demo</title>

<!--
  认领用。把 content 换成认领页给你的 nonce，保存发布，然后回去点「开始验证」。
  认领完成后这行可以删掉 —— 它只在认领那一刻被读一次。
-->
<meta name="xmeta-verify" content="PUT_NONCE_HERE">

<link rel="stylesheet" href="xmeta-ui.css">

<style>
  /* 清除按钮：不要边框，靠虚下划线 + 手型光标表明它可点 */
  .xm-linkbtn {
    align-self: center;
    background: none; border: 0; padding: 4px 8px; font: inherit;
    font-size: 13px; color: var(--xm-ink-3);
    text-decoration: underline; text-decoration-style: dotted;
    text-underline-offset: 4px; cursor: pointer;
  }
  .xm-linkbtn:hover { color: var(--xm-pink); }
</style>

<script src="//s1.hdslb.com/bfs/seed/toy/app/sdk/toy-sdk.js"></script>
<script src="https://www.oxth.com:8443/xmeta-client.js"></script>
</head>
<body class="xm">
<div class="xm-page">

  <div class="xm-hero" style="text-align:left">
    <p class="xm-kicker">xmeta 联机</p>
    <h1 class="xm-display">联机 Demo</h1>
  </div>

  <!-- 没配 client_id 时的接入指引 -->
  <div class="xm-alert xm-alert--warn xm-hidden xm-mt-lg" id="cfgWarn">
    <b>还没配置 client_id</b> —— 需要先认领这款 toy：
    <ol style="margin:8px 0 0;padding-left:18px">
      <li>打开中心 toy xmeta 的「认领 toy」页</li>
      <li>填入本 toy 的 slug，拿到验证码</li>
      <li>把验证码填到本文件顶部的 meta 里，保存发布</li>
      <li>回到认领页点「开始验证」，拿到 client_id</li>
      <li>把 client_id 填到下方 <span class="xm-mono">CONFIG.clientId</span>，再次发布</li>
    </ol>
  </div>

  <div class="xm-card xm-mt-lg xm-rise">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px">
      <span class="xm-label" style="margin:0">联机状态</span>
      <span class="xm-live" id="vState">未连接</span>
    </div>
    <div class="xm-kv">
      <span class="xm-kv__k">client_id</span>
      <span class="xm-kv__v xm-mono" id="vCid">—</span>
    </div>
    <div class="xm-kv xm-hidden" id="rowUid">
      <span class="xm-kv__k">身份 uid</span>
      <span class="xm-kv__v xm-mono" id="vUid">—</span>
    </div>
    <div class="xm-kv xm-hidden" id="rowLeft">
      <span class="xm-kv__k">有效期</span>
      <span class="xm-kv__v" id="vLeft">—</span>
    </div>
  </div>

  <!-- 就一个按钮：申请联机凭证，占满整行。拿到 code 后自动兑换，
       没有第二个「连接」按钮要用户点。 -->
  <div class="xm-actions xm-mt-lg">
    <button class="xm-btn xm-btn--primary" id="btnLogin">申请联机凭证</button>
  </div>
  <div class="xm-actions" style="margin-top:6px">
    <button class="xm-linkbtn" id="btnReset">清除本地凭证（安全）</button>
  </div>

  <div class="xm-alert xm-alert--error xm-hidden xm-mt-lg" id="errBox"></div>

  <!-- 临时诊断：看清「从中心 toy 跳回来」那一刻有没有重载 / URL 上有没有特征。
       查完连同脚本里的 DIAG 段一起删。 -->
  <details class="xm-card xm-mt-lg" style="margin-top:24px">
    <summary class="xm-small" style="cursor:pointer;color:var(--xm-ink-3)">
      诊断（临时）· <span id="diagKey">—</span>
    </summary>
    <pre id="diagLog" class="xm-mono"
         style="max-height:240px;overflow:auto;font-size:11px;line-height:1.5;white-space:pre-wrap;word-break:break-all;margin:12px 0 8px"></pre>
    <button class="xm-linkbtn" id="diagClear">清空诊断</button>
  </details>

  <div class="xm-foot">
    <span class="xm-brand"><span class="xm-brand__dot"></span>xmeta 身份服务</span>
  </div>
</div>

<script>
// ─────────────────────────────────────────────
// 配置：认领拿到 client_id 后填到这里
// ─────────────────────────────────────────────
const CONFIG = {
  apiBase:       'https://www.oxth.com:8443',
  centerToySlug: 'xmeta',
  // 中心 toy 的 toy_id（写死的）。诊断用：App 内 toy→toy 跳转会native 拼一个
  // from_spmid=toy.toy-detail.<来源 toy 的 toy_id>.0，靠它认「刚从中心 toy 跳回来」。
  centerToyId:   '39945062320128',
  clientId:      'xmeta_v8lTN7_zee7Kv11TxkN7BQ'
}

const $ = (id) => document.getElementById(id)

function showErr(msg) { $('errBox').textContent = msg; $('errBox').classList.remove('xm-hidden') }
function clearErr() { $('errBox').classList.add('xm-hidden') }

// ─────────────────────────────────────────────────────────────
// 临时诊断 —— 只为看清「从中心 toy 跳回来」那一刻到底发生了什么：
//   · 回来的 URL 上有没有原生拼的 from_spmid=toy.toy-detail.<中心toy id>.0
//   · 页面是重载了（load / pageshow），还是只切回了前台（visibility / focus）
//   · 那一刻共享槽 xmeta:req / xmeta:code 是什么状态
//
// 记录写在 localStorage（xmeta:diag），刷新、重开 App 都还在。
// 纯观测，不改任何行为。查完整段删掉即可（HTML 里那个 #diagBox 一起删）。
// ─────────────────────────────────────────────────────────────
const DIAG_KEY = 'xmeta:diag'
const DIAG_MAX = 80

function diagSnapshot() {
  const spmid = new URLSearchParams(location.search).get('from_spmid') || ''
  const snap = {
    url: location.search || '(无参数)',
    spmid: spmid || '(无)',
    hit: spmid.indexOf('toy.toy-detail.' + CONFIG.centerToyId + '.') === 0
  }
  try {
    const req = JSON.parse(localStorage.getItem('xmeta:req') || 'null')
    if (req && req.cid) {
      snap.req = '有(发起于' + Math.round((Date.now() - req.ts) / 1000) +
        '秒前,claimed=' + req.claimed + ')'
    }
  } catch (e) { /* 忽略 */ }
  // 本轮 PKCE 记录。兑换要拿它和槽里的 state 对上号 —— 对不上就永远检测不到，
  // 而且不报错，所以必须记下来。
  let myState = null
  try {
    const verifier = localStorage.getItem('xmeta:pkce:' + CONFIG.clientId)
    myState = localStorage.getItem('xmeta:pkce:' + CONFIG.clientId + ':st')
    snap.pkce = verifier ? ('有,st=' + (myState ? myState.slice(0, 6) : '(无)')) : '无'
  } catch (e) { /* 忽略 */ }
  try {
    const p = JSON.parse(localStorage.getItem('xmeta:code') || 'null')
    if (p && p.code) {
      snap.slot = '有码(clientId匹配=' + (p.clientId === CONFIG.clientId) +
        ',state匹配=' + (!!myState && p.state === myState) +
        ',剩' + Math.round(((p.expiresAt || 0) - Date.now()) / 1000) + '秒)'
    }
  } catch (e) { /* 忽略 */ }
  // 本地到底还有哪些 xmeta 键 —— 「键被清掉」还是「键名不对」，只有这一招能分辨
  try {
    const keys = []
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i)
      if (k && k.indexOf('xmeta') === 0) keys.push(k)
    }
    snap.keys = keys.length ? keys.join(' ') : '(无)'
  } catch (e) { /* 忽略 */ }
  // bridge.html 每次加载都会盖一个戳：它在不在、多久之前盖的
  try {
    const b = JSON.parse(localStorage.getItem('xmeta:bridge') || 'null')
    snap.bridge = b ? ('v' + b.v + ' @' + Math.round((Date.now() - b.ts) / 1000) + '秒前') : '无'
  } catch (e) { /* 忽略 */ }
  return snap
}

function diagLog(ev, extra) {
  const entry = Object.assign({ t: new Date().toTimeString().slice(0, 8), ev }, diagSnapshot())
  if (extra) entry.extra = extra
  let log = []
  try { log = JSON.parse(localStorage.getItem(DIAG_KEY) || '[]') } catch (e) { log = [] }
  // 写之前日志里有几条。回来那一条要是 before=0（不是第一次跑），说明
  // 连这段日志本身都被清过 —— 那就是整个 localStorage 被回收了。
  entry.before = log.length
  log.push(entry)
  if (log.length > DIAG_MAX) log = log.slice(-DIAG_MAX)
  try { localStorage.setItem(DIAG_KEY, JSON.stringify(log)) } catch (e) { /* 忽略 */ }
  diagPaint()
}

function diagPaint() {
  let log = []
  try { log = JSON.parse(localStorage.getItem(DIAG_KEY) || '[]') } catch (e) { log = [] }
  const last = log[log.length - 1]
  $('diagKey').textContent = last
    ? (last.hit ? '✓ 带回跳特征' : '✗ 无回跳特征') + ' · ' + last.url
    : '暂无记录'
  $('diagLog').textContent = log.map((e) =>
    e.t + ' ' + e.ev + ' (此前' + e.before + '条)' +
    ' | spmid=' + e.spmid +
    ' | req=' + (e.req || '无') +
    ' | pkce=' + (e.pkce || '无') +
    ' | slot=' + (e.slot || '空') +
    (e.extra ? ' | ' + e.extra : '') +
    '\n     keys=' + (e.keys || '?') +
    ' | bridge=' + (e.bridge || '?')
  ).join('\n')
}

const navEntry = (performance.getEntriesByType && performance.getEntriesByType('navigation')[0]) || null
diagLog('load', 'nav=' + ((navEntry && navEntry.type) || '?') + ' ref=' + (document.referrer || '无'))

addEventListener('pageshow', (e) => diagLog('pageshow', 'persisted=' + e.persisted + ' hidden=' + document.hidden))
addEventListener('pagehide', (e) => diagLog('pagehide', 'persisted=' + e.persisted))
addEventListener('beforeunload', () => diagLog('beforeunload'))
addEventListener('focus', () => diagLog('focus'))
addEventListener('blur', () => diagLog('blur'))
document.addEventListener('visibilitychange', () => diagLog('visibility', 'hidden=' + document.hidden))
$('diagClear').addEventListener('click', () => {
  try { localStorage.removeItem(DIAG_KEY) } catch (e) { /* 忽略 */ }
  diagPaint()
})

// 把 SDK 的入口包一层：谁在什么时候动了本地状态，日志里就会留下痕迹。
// （`logout()` 是唯一会同时清掉 PKCE 记录和 xmeta:req 的地方，重点盯它。）
if (typeof XMETA !== 'undefined') {
  ;['login', 'completeLogin', 'logout', 'setSession'].forEach((name) => {
    const orig = XMETA[name]
    if (typeof orig !== 'function') return
    XMETA[name] = function () {
      diagLog('→ 调用 XMETA.' + name + '()')
      return orig.apply(this, arguments)
    }
  })
}

// ── 申请联机凭证（必须在用户手势里调用，toy.navigate 需要手势）──
//
// 防连点**不用 disabled**：disabled 一旦设上就得有人把它清掉，而跳走之后
// 这段代码可能根本跑不到（用户手动返回、页面没重载），按钮就会一直灰着，
// 只能刷新页面 —— 实测踩过。改成按时间判：1.5 秒内的重复点击忽略，
// 时间一过自然放开，没有任何需要清理的状态。
let lastApplyAt = 0

$('btnLogin').addEventListener('click', async () => {
  const now = Date.now()
  if (now - lastApplyAt < 1500) return
  lastApplyAt = now

  clearErr()
  diagLog('点了申请联机凭证')
  try {
    await XMETA.login()
    // 成功的话页面就被跳走了，这行不会执行到
  } catch (e) {
    showErr('申请失败：' + (e.message || e))
  }
})

// ── 兑换：SDK 一检测到 code，就在这里换掉 ──
//
// 没有「连接」按钮了 —— 中心 toy 把 code 带回来，onCodeReady 一响就
// 自动兑换。
//
// 「跳走再跳回来」会留下两个页面实例（用户点的那个还在后台跑），两边
// 都可能触发兑换。code 一次性，只有一个能成功；输的那边收到 code_used，
// SDK 会去读赢家写在同源 localStorage 里的会话当成成功。所以谁先谁后
// 都不影响结果。
async function redeem() {
  clearErr()
  try {
    await XMETA.completeLogin()
  } catch (e) {
    // 槽里的 code 还在（网络抖动这类可重试的失败不会清槽），刷新页面
    // 就会重新检测、重新兑换。
    diagLog('兑换失败', 'msg=' + (e.message || e))
    showErr('兑换凭证失败：' + (e.message || e) + '（刷新页面可重试）')
  }
}

// ── 清除凭证（调试用）──
//
// 只清本地那一份：SDK 的 logout() 会把会话、PKCE 记录、待兑换的码
// 一起清掉。云存储本来就没在用，没有第二份要清。
$('btnReset').addEventListener('click', () => {
  clearErr()
  if (typeof XMETA === 'undefined') {
    showErr('xmeta-client.js 没加载，清不了本地凭证。')
    return
  }
  XMETA.logout()   // 会话没了 → 下一次心跳把状态刷回未连接
})

// ── 剩余时间 ──
// 用户自己选的时长，过期后要回中心 toy 再授权一次。把它显示出来，
// 别让人玩到一半突然掉线还不知道为什么。
function fmtLeft(ms) {
  const s = Math.floor(ms / 1000)
  const h = Math.floor(s / 3600)
  const m = Math.floor((s % 3600) / 60)
  if (h > 0) return h + ' 小时 ' + m + ' 分'
  if (m > 0) return m + ' 分 ' + (s % 60) + ' 秒'
  return (s % 60) + ' 秒'
}

// ── 状态渲染 ────────────────────────────────────────────────────
//
// 指示灯两态：有会话 → 已连接，没有 → 未连接。「拿到码还没兑换」不再是
// 一个要用户处理的中间态 —— 它自己会过去。
const STATE_TEXT = { idle: '未连接', online: '已连接' }
const STATE_CLS = {
  idle: 'xm-live',
  online: 'xm-live xm-live--on'
}

function render() {
  if (typeof XMETA === 'undefined' || !configured) return
  const s = XMETA.getSession()
  const st = s ? 'online' : 'idle'

  // 指示灯
  $('vState').textContent = STATE_TEXT[st]
  $('vState').className = STATE_CLS[st]

  // 身份 / 有效期
  $('rowUid').classList.toggle('xm-hidden', !s)
  $('rowLeft').classList.toggle('xm-hidden', !s)
  if (s) {
    $('vUid').textContent = s.uid || '—'
    $('vLeft').textContent = '还剩 ' + fmtLeft(XMETA.getRemainingMs())
  }

  // 已经连上了就是「重新申请」
  $('btnLogin').textContent = s ? '重新申请凭证' : '申请联机凭证'
}

// 每秒重画一次：有效期倒计时本来就每秒在变，顺带把状态也刷新了
// （token 过期 → 已连接退回未连接）
setInterval(render, 1000)

// ── 云存储不用了 ──
//
// toy.getCloudStorage 是 async 的（1-2 秒），在 click handler 里 await 它
// 会让 navigator.userActivation 失效，不 await 又会截胡 toy.navigate。
// 凭证只存 SDK 自己的 localStorage（key 带 clientId 前缀），跨设备恢复
// 那套就不要了。

let configured = false

if (!CONFIG.clientId || CONFIG.clientId === 'PUT_CLIENT_ID_HERE') {
  $('cfgWarn').classList.remove('xm-hidden')
  $('vCid').textContent = '未配置'
  $('btnLogin').disabled = true
} else {
  $('vCid').textContent = CONFIG.clientId
  if (typeof XMETA === 'undefined') {
    // xmeta-client.js 是从中心服务器加载的，服务器挂了就拿不到 XMETA。
    // 此时联机功能不可用，但 toy 本身还能跑，别把整个页面搞崩。
    showErr('xmeta 服务暂时不可用，联机功能无法初始化。请稍后重试。')
    $('btnLogin').disabled = true
  } else {
    try {
      XMETA.configure(CONFIG)
      configured = true
    } catch (e) {
      showErr('初始化失败：' + e.message)
      $('btnLogin').disabled = true
    }
  }
}

if (configured) {
  // 状态一变就重画。每秒那趟心跳兜底，这里只是为了不用等到下一秒。
  XMETA.onSession(() => {
    diagLog('已连接（onSession）')
    render()
    clearErr()
  })

  // 检测到待兑换的授权码 —— 直接兑换，不等用户点。
  //
  // 先确认 SDK 是新版：它是从中心服务器分发的，改了仓库没重启服务端的话
  // 这里拿到的是旧脚本。旧脚本没有 onCodeReady，回跳之后就什么都不会发生，
  // 表现是「申请完回来还是未连接」，而下面那行还会抛 TypeError 把后面的
  // 注册全带走，极难排查。
  if (typeof XMETA.onCodeReady !== 'function') {
    showErr('xmeta-client.js 还是旧版本（没有 onCodeReady）。' +
      '需要先部署服务端并重启，或强制刷新页面。')
    $('btnLogin').disabled = true
  } else {
    XMETA.onCodeReady((p) => {
      diagLog('onCodeReady', 'code=' + String(p && p.code).slice(0, 8) + '…')
      redeem()
    })
  }
}

render()   // 别等第一次心跳，进来就先画一遍
</script>
</body>
</html>
