<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>联机数据测试台</title>
<link rel="stylesheet" href="xmeta-ui.css">
<style>
  /* 只加这一个页面要用的几块，其余全用共用设计系统的类 */

  /* 令牌 / 返回 那一行：横向排，右边那个自动靠右 */
  .kv-row { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
  .kv-right { margin-left: auto; }
  .kv-sep { color: var(--xm-line); }

  /* 快捷填充：可折起的分组卡片 */
  .kv-summary { cursor: pointer; font-size: 13.5px; font-weight: 600; color: var(--xm-ink-2); }
  .kv-summary::marker { color: var(--xm-ink-3); }
  .kv-group {
    font-size: 11.5px; letter-spacing: .08em; color: var(--xm-ink-3);
    margin: 18px 0 8px;
  }
  .kv-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 8px; }

  .kv-fill {
    display: block; text-align: left; width: 100%;
    background: var(--xm-surface); border: 1px solid var(--xm-line);
    border-radius: 12px; padding: 10px 12px; cursor: pointer; font: inherit;
    transition: border-color .15s ease, transform .12s ease;
  }
  .kv-fill:hover { border-color: var(--xm-pink); }
  .kv-fill:active { transform: scale(.985); }
  .kv-fill b { display: block; font-size: 13.5px; font-weight: 600; color: var(--xm-ink); }
  .kv-fill i {
    display: block; font-style: normal;
    font-size: 11.5px; line-height: 1.5; color: var(--xm-ink-3); margin-top: 3px;
  }

  /* 返回区 */
  .kv-code { margin-left: auto; font-size: 12px; font-weight: 600; color: var(--xm-ink-3); }
  .kv-code--ok { color: var(--xm-ok); }
  .kv-code--bad { color: var(--xm-danger); }
  .kv-out {
    margin: 12px 0 0; padding: 12px 14px; border-radius: 10px;
    background: var(--xm-sunken); color: var(--xm-ink-2);
    font-size: 12px; line-height: 1.55;
    white-space: pre-wrap; word-break: break-all;
    max-height: 380px; overflow: auto;
  }
  .kv-out:empty::before { content: '发送一个请求，这里会显示状态码和返回的 JSON。'; color: var(--xm-ink-3); }
</style>
<script src="//s1.hdslb.com/bfs/seed/toy/app/sdk/toy-sdk.js"></script>
<script src="https://www.oxth.com:8443/xmeta-client.js"></script>
</head>
<body class="xm">
<div class="xm-page">

  <div class="xm-hero" style="text-align:left">
    <p class="xm-kicker">xmeta 联机数据</p>
    <h1 class="xm-display">测试台</h1>
  </div>

  <!-- 令牌：一行读完 -->
  <div class="xm-card xm-mt-lg xm-rise">
    <div class="kv-row">
      <span class="xm-live" id="vState">未连接</span>
      <span class="kv-sep">·</span>
      <span class="xm-small">uid <b class="xm-mono" id="vUid">—</b></span>
      <span class="kv-sep">·</span>
      <span class="xm-small" id="vLeft">点右边按钮过桥拿一枚</span>
      <button class="xm-btn xm-btn--ghost xm-btn--sm kv-right" id="btnToken">申请联机凭证</button>
    </div>
    <p class="xm-small xm-mt">
      所有请求都带这枚令牌。没连接时发出去会 401 —— 这也是要验的一条。
    </p>
  </div>

  <!-- 快捷填充：分组、可折起 -->
  <details class="xm-card xm-mt-lg xm-rise xm-rise--2" open>
    <summary class="kv-summary">快捷填充 —— 点一下填进下面的表单，再按「发送」</summary>

    <p class="kv-group">读</p>
    <div class="kv-grid">
      <button class="kv-fill" data-fill="get"><b>读我这一格</b><i>没建过返回 data:null，不是报错</i></button>
      <button class="kv-fill" data-fill="list"><b>列这个 scope 的所有人</b><i>分页，默认 20 条；非作者只看得到公开的</i></button>
      <button class="kv-fill" data-fill="filter"><b>按标签筛人</b><i>数字标签就是为筛选准备的</i></button>
      <button class="kv-fill" data-fill="log"><b>看某一格改过什么</b><i>每次改动一条，含前后值；只读</i></button>
      <button class="kv-fill" data-fill="profiles"><b>uid 换昵称头像</b><i>数据里只存 id，显示名字时用这个</i></button>
    </div>

    <p class="kv-group">写</p>
    <div class="kv-grid">
      <button class="kv-fill" data-fill="put"><b>建 / 整行覆盖</b><i>没写的字段会清空，日常别用它</i></button>
      <button class="kv-fill" data-fill="patch"><b>只改几个字段</b><i>其余原样保留，日常写数据用这个</i></button>
      <button class="kv-fill" data-fill="inc"><b>原子加减</b><i>打 boss 用：并发几百人也不会丢更新</i></button>
      <button class="kv-fill" data-fill="other"><b>改别人开给我的字段</b><i>那格 open_edit 开了什么才能改什么</i></button>
    </div>

    <p class="kv-group">作者专属</p>
    <div class="kv-grid">
      <button class="kv-fill" data-fill="admin"><b>建世界 boss</b><i>admin* 开头的 scope 只有作者能建</i></button>
      <button class="kv-fill" data-fill="delrow"><b>删掉我一格</b><i>清空间，不用等过期；只能删自己的</i></button>
      <button class="kv-fill" data-fill="delscope"><b>删整个 scope</b><i>清掉所有人的格，要显式带 ?all=1</i></button>
    </div>

    <p class="kv-group">调试</p>
    <div class="kv-grid">
      <button class="kv-fill" data-fill="bad"><b>参数违规</b><i>文本超长 / extra 超大 / 非法 open_edit，看 400</i></button>
    </div>

    <p class="xm-small xm-mt">
      uid 从「列这个 scope 的所有人」的结果里抄一个，上面写的 <b>466 换成你库里真实存在的 uid</b>。
      想看「非作者改未开放字段 → 403」得换个不是作者的身份，测试台上办不到（你就是作者），
      这条在 e2e 里用三个令牌验过。
    </p>
  </details>

  <!-- 请求 -->
  <div class="xm-card xm-mt-lg xm-rise xm-rise--3">
    <div class="kv-row" style="flex-wrap:nowrap">
      <select id="method" class="xm-input" style="width:104px;flex:none">
        <option>GET</option>
        <option>POST</option>
        <option>PUT</option>
        <option>PATCH</option>
        <option>DELETE</option>
      </select>
      <input id="path" class="xm-input xm-mono" value="/api/kv/package"
             placeholder="/api/kv/package/list?page=1&amp;size=20">
    </div>
    <textarea id="body" class="xm-input xm-mono xm-mt" rows="6" spellcheck="false"
      placeholder='请求体（PUT / PATCH 才用），例如：
{ "ttlDays": 7, "isPublic": true, "openEdit": ["tag_int1"], "tagInt1": 100, "text1": "hi" }'></textarea>
    <div class="xm-actions" style="margin-top:10px">
      <button class="xm-btn xm-btn--primary" id="btnSend">发送</button>
      <button class="xm-btn xm-btn--quiet" id="btnClear">清空返回</button>
    </div>
  </div>

  <!-- 返回 -->
  <div class="xm-card xm-mt-lg">
    <div class="kv-row">
      <span class="xm-label" style="margin:0">返回</span>
      <span class="kv-code" id="vCode">—</span>
    </div>
    <pre id="out" class="kv-out"></pre>
  </div>

  <div class="xm-foot">
    <span class="xm-brand"><span class="xm-brand__dot"></span>xmeta 联机数据测试台</span>
  </div>
</div>

<script>
// 和 demo-toy/index.html 用同一个 client_id / 中心 toy
const CONFIG = {
  apiBase:       'https://www.oxth.com:8443',
  centerToySlug: 'xmeta',
  centerToyId:   '39945062320128',
  clientId:      'xmeta_v8lTN7_zee7Kv11TxkN7BQ'
}

const $ = (id) => document.getElementById(id)

/** 从 JWT 里解出 sub —— 只是给页面显示用，服务端那边才验签 */
function decodeSub(jwt) {
  try {
    return JSON.parse(atob(jwt.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'))).sub || null
  } catch (e) { return null }
}

let myUid = null

function token() {
  const s = typeof XMETA !== 'undefined' ? XMETA.getSession() : null
  return s ? s.jwt : null
}

function fmtLeft(ms) {
  const s = Math.round(ms / 1000)
  if (s >= 3600) return '还剩 ' + Math.floor(s / 3600) + ' 小时 ' + Math.floor((s % 3600) / 60) + ' 分'
  if (s >= 60) return '还剩 ' + Math.floor(s / 60) + ' 分钟'
  return '还剩 ' + s + ' 秒'
}

function render() {
  const s = typeof XMETA !== 'undefined' ? XMETA.getSession() : null
  $('vState').textContent = s ? '已连接' : '未连接'
  $('vState').className = s ? 'xm-live xm-live--on' : 'xm-live'
  myUid = s ? decodeSub(s.jwt) : null
  $('vUid').textContent = myUid || '—'
  $('vLeft').textContent = s ? fmtLeft(XMETA.getRemainingMs()) : '点右边按钮过桥拿一枚'
  $('btnToken').textContent = s ? '重新申请凭证' : '申请联机凭证'
}
setInterval(render, 1000)

function out(code, payload) {
  const el = $('vCode')
  if (code === null || code === undefined) {
    el.textContent = '—'
    el.className = 'kv-code'
    $('out').textContent = ''
    return
  }
  const ok = typeof code === 'number' && code >= 200 && code < 300
  el.textContent = String(code) + (ok ? ' OK' : '')
  el.className = 'kv-code ' + (ok ? 'kv-code--ok' : 'kv-code--bad')
  $('out').textContent = payload === undefined ? '' : JSON.stringify(payload, null, 2)
}

// ── 令牌：走一遍正常的过桥流程 ──
$('btnToken').addEventListener('click', async () => {
  if (typeof XMETA === 'undefined') { $('out').textContent = 'xmeta-client.js 没加载'; return }
  try {
    await XMETA.login()
  } catch (e) {
    out('登录失败', { message: e.message || String(e) })
  }
})

// ── 发请求 ──
$('btnSend').addEventListener('click', async () => {
  const method = $('method').value
  const path = $('path').value.trim()
  const jwt = token()

  const init = { method, headers: {} }
  if (jwt) init.headers.Authorization = 'Bearer ' + jwt
  const raw = $('body').value.trim()
  if (raw && method !== 'GET' && method !== 'DELETE') {
    try {
      JSON.parse(raw)
    } catch (e) {
      out('请求体不是合法 JSON', { error: e.message })
      return
    }
    init.headers['Content-Type'] = 'application/json'
    init.body = raw
  }

  $('btnSend').disabled = true
  try {
    const res = await fetch(CONFIG.apiBase + path, init)
    let json = null
    try { json = await res.json() } catch (e) { json = { raw: await res.text().catch(() => '') } }
    out(res.status, json)
  } catch (e) {
    out('网络错误', { message: e.message || String(e) })
  } finally {
    $('btnSend').disabled = false
  }
})

$('btnClear').addEventListener('click', () => out(null))

// ── 快捷填充：把一套典型请求塞进表单，点「发送」就能看结果 ──
const FILLS = {
  // 读
  get: () => ['GET', '/api/kv/package', null],
  list: () => ['GET', '/api/kv/package/list?page=1&size=20', null],
  filter: () => ['GET', '/api/kv/roles/list?page=1&size=20&tagTinyint=1', null],
  log: () => ['GET', '/api/kv/board/466/log?page=1&size=20', null],
  profiles: () => ['POST', '/api/user/profiles', { uids: ['466', '10'] }],

  // 写
  put: () => ['PUT', '/api/kv/package', {
    ttlDays: 7, isPublic: false, openEdit: [],
    tagTinyint: 1, tagInt1: 100, text1: '我的背包', text2: '摘要', extra: { items: ['sword'] }
  }],
  patch: () => ['PATCH', '/api/kv/package', { tagInt1: 101, text1: '只改这两项' }],
  // inc：增量交给服务端算（客户端自己「读出来加一再写回去」在并发下必然丢更新）
  inc: () => ['PATCH', '/api/kv/admin_world?uid=10', { inc: { tagInt1: -10 } }],
  other: () => ['PATCH', '/api/kv/board?uid=466', { tagInt1: 20, text1: '被别人改过了' }],

  // 作者专属
  admin: () => ['PUT', '/api/kv/admin_world', {
    ttlDays: 30, isPublic: true, openEdit: ['tag_int1'], tagInt1: 1000, text1: '世界 Boss'
  }],
  delrow: () => ['DELETE', `/api/kv/package/${myUid || '<我的uid>'}`, null],
  delscope: () => ['DELETE', '/api/kv/package?all=1', null],

  // 调试
  bad: () => ['PATCH', '/api/kv/package', {
    text1: 'x'.repeat(200),                    // 超 128 字符
    extra: { blob: 'x'.repeat(3000) },         // 超 2048 字节
    openEdit: ['extra']                        // extra 不许进白名单
  }]
}

document.querySelectorAll('[data-fill]').forEach((btn) => {
  btn.addEventListener('click', () => {
    const [method, path, body] = FILLS[btn.getAttribute('data-fill')]()
    $('method').value = method
    $('path').value = path
    $('body').value = body ? JSON.stringify(body, null, 2) : ''
    // 填完把「发送」带到眼前，省得在手机上翻了半天找不到
    $('btnSend').scrollIntoView({ block: 'center', behavior: 'smooth' })
  })
})

// ── 初始化 ──
if (typeof XMETA === 'undefined') {
  $('out').textContent = 'xmeta-client.js 没加载 —— 检查 apiBase 是否可达'
} else {
  try {
    XMETA.configure(CONFIG)
    XMETA.onSession(() => render())
    if (typeof XMETA.handleRedirect === 'function') XMETA.handleRedirect()
  } catch (e) {
    $('out').textContent = '初始化失败：' + e.message
  }
}
render()
</script>
</body>
</html>
