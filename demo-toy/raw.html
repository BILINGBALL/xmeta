<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>裸接入示例 · xmeta</title>
<script src="//s1.hdslb.com/bfs/seed/toy/app/sdk/toy-sdk.js"></script>
</head>
<body style="font:14px/1.7 system-ui;padding:24px;max-width:640px;margin:0 auto">

<h1 style="font-size:20px">裸接入示例</h1>
<p style="color:#666">
  不用 xmeta-client.js，全部逻辑约 60 行。想自己接就照抄这个文件。
</p>

<div style="margin:24px 0">
  <button id="btnLogin" style="padding:10px 18px;font-size:15px">开启联机</button>
  <button id="btnFinish" hidden style="padding:10px 18px;font-size:15px">完成连接</button>
</div>

<p id="out" style="color:#666"></p>
<pre id="jwt" style="white-space:pre-wrap;word-break:break-all;font-size:12px;color:#333"></pre>

<script>
// ═══════════════════════════════════════════════════════════════════
// 第三方 toy 接入 xmeta —— 全部逻辑就两步
//
//   ① 点「开启联机」→ 生成 PKCE → 跳中心 toy
//   ② 跳回来后点「完成连接」→ 用 code 换 JWT
//
// 只用到三个写死的名字，没有任何 SDK：
//   POST   {API}/api/oauth/token
//   读     localStorage['xmeta:code']   中心 toy 写的授权码
//   写     localStorage['xmeta:req']    我们写给中心 toy 的请求
// ═══════════════════════════════════════════════════════════════════

// ── 配置：换成你自己的 ────────────────────────────────────────────
const API         = 'https://www.oxth.com:8443'      // 必须 https，否则被混合内容拦掉
const CENTER_SLUG = 'xmeta'                          // 中心 toy 的 slug
const CID         = 'xmeta_v8lTN7_zee7Kv11TxkN7BQ'   // 认领后拿到的 client_id

// verifier / state 存哪。**前缀别省** —— localStorage 在 www.bilibilitoy.com
// 下是所有 toy 共享的，不带前缀就会互相踩。
const VERIFIER_KEY = 'raw:' + CID + ':verifier'
const STATE_KEY    = 'raw:' + CID + ':state'


// ── 两个小工具 ──────────────────────────────────────────────────
const b64url = (bytes) =>
  btoa(String.fromCharCode.apply(null, bytes))
    .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '')

const randomString = (n) => b64url(crypto.getRandomValues(new Uint8Array(n)))

/** PKCE challenge = base64url(sha256(verifier)) */
async function s256(input) {
  const digest = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(input))
  return b64url(new Uint8Array(digest))
}


// ── 为什么要「预生成」PKCE ────────────────────────────────────────
// toy.navigate 必须在用户手势里**同步**调用：SDK 会检查
// navigator.userActivation.isActive，那是瞬时状态，中间插一个 await
// 就可能已经失效。而 s256 是异步的 —— 所以趁页面加载先把 challenge
// 算好，点按钮时直接取用。
let prepared = null

function preparePkce() {
  const verifier = randomString(32)
  s256(verifier)
    .then((challenge) => { prepared = { verifier, challenge } })
    .catch(() => { prepared = null })
}
preparePkce()          // 页面一加载就开算


// ── ① 开启联机 ──────────────────────────────────────────────────
async function login() {
  // 取预生成的；极小概率还没算完（页面刚打开就点），现场补一次
  let pair = prepared
  if (!pair) {
    const verifier = randomString(32)
    pair = { verifier, challenge: await s256(verifier) }
  }
  prepared = null
  preparePkce()        // 立刻给下一轮再备一对

  const state = randomString(16)

  try {
    localStorage.setItem(VERIFIER_KEY, pair.verifier)
    localStorage.setItem(STATE_KEY, state)
  } catch (e) { /* 隐私模式下写不进去，回来时会提示重新走一遍 */ }

  // App 里 toy.navigate 走原生通道，实测**不透传 extra**：跳过去之后
  // 目标页的 URL 上什么都没有。所以参数还得另写一份到共享的 localStorage，
  // 中心 toy 会去那里读。Web 端 extra 正常，但两边都写就不用分支了。
  try {
    localStorage.setItem('xmeta:req', JSON.stringify({
      cid: CID,              // 哪款 toy 在请求
      cc: pair.challenge,    // PKCE challenge
      st: state,             // 接入方自己的 state
      ts: Date.now(),        // 中心 toy 会丢弃超过 3 分钟的旧请求
      claimed: false         // 中心 toy 接手后会改成 true
    }))
  } catch (e) { /* 同上 */ }

  // extra 和 localStorage 内容一致，只是两条通道
  await toy.navigate({
    type: 'toy',
    id: CENTER_SLUG,
    extra: { cid: CID, cc: pair.challenge, st: state }
  })
}


// ── ② 跳回来了：先看看有没有待连接的授权码 ──────────────────────
/**
 * 中心 toy 在用户点「返回游戏」时，会把授权码写进共享槽：
 *   localStorage['xmeta:code'] = { v, clientId, code, state, returnSlug, expiresAt, ts }
 * 这是**只读**的 —— 没换成 JWT 之前别删它，也别拿去换第二次。
 */
function detectCode() {
  let p = null
  try { p = JSON.parse(localStorage.getItem('xmeta:code') || 'null') } catch (e) { return null }
  if (!p || !p.code) return null

  // 槽是全局的（所有 toy 共用同一个键），所以这两条过滤不能省
  if (p.clientId !== CID) return null
  if (p.expiresAt && Date.now() > p.expiresAt) return null

  // 必须对得上「我们这一轮」—— 不然上一轮的残留会被当成新的
  const state = localStorage.getItem(STATE_KEY)
  if (!state || p.state !== state) return null

  return p
}


// ── ③ 用户点了「完成连接」才真正去换 ────────────────────────────
async function connect() {
  const p = detectCode()
  if (!p) throw new Error('没有待连接的授权码，请先点「开启联机」')

  const verifier = localStorage.getItem(VERIFIER_KEY)
  if (!verifier) throw new Error('本地找不到 PKCE 记录，请再点一次「开启联机」')

  const res = await fetch(API + '/api/oauth/token', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      grant_type: 'authorization_code',
      code: p.code,
      client_id: CID,
      code_verifier: verifier      // 服务端会拿它和当初的 challenge 对
    })
  })

  const json = await res.json().catch(() => ({}))
  if (!res.ok) {
    // 授权码是一次性的，服务端先消费再校验 PKCE —— 出错基本就得重来一遍
    throw new Error((json.error && json.error.message) || ('HTTP ' + res.status))
  }

  // 成功是终态，这时候才清
  localStorage.removeItem('xmeta:code')
  localStorage.removeItem(VERIFIER_KEY)
  localStorage.removeItem(STATE_KEY)

  return json.access_token
}


// ═══════════════════════════════════════════════════════════════════
// 到这儿协议部分就完了，下面是页面接线
// ═══════════════════════════════════════════════════════════════════
const $ = (id) => document.getElementById(id)

function showConnect() {
  $('btnFinish').hidden = false
  $('out').textContent = '拿到授权码了，点「完成连接」。'
}

$('btnLogin').addEventListener('click', async () => {
  $('out').textContent = ''
  $('btnFinish').hidden = true
  try {
    await login()
  } catch (e) {
    $('out').textContent = '跳转失败：' + (e.message || e)
  }
})

$('btnFinish').addEventListener('click', async () => {
  $('out').textContent = '连接中…'
  try {
    const jwt = await connect()
    $('btnFinish').hidden = true
    $('out').textContent = '已连接。access_token 在下面 —— 请交给你的服务端验签。'
    $('jwt').textContent = jwt
  } catch (e) {
    $('out').textContent = '连接失败：' + (e.message || e)
  }
})

// 页面加载时就查一次：跳回来如果页面重新加载了，这一步就够了
if (detectCode()) showConnect()

// App 里有时候跳回来页面**不会**重新加载，那就得自己盯一会儿。
// （xmeta-client.js 做的事情一样，只是包了一层。）
const timer = setInterval(() => {
  if (detectCode()) { clearInterval(timer); showConnect() }
}, 1000)
setTimeout(() => clearInterval(timer), 3 * 60 * 1000)
</script>
</body>
</html>
