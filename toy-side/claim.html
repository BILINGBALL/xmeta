<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>玩具认领</title>
<script src="//s1.hdslb.com/bfs/seed/toy/app/sdk/toy-sdk.js"></script>
<style>
  :root { color-scheme: light dark; }
  body { margin:0; font:15px/1.6 system-ui,-apple-system,"PingFang SC",sans-serif;
         background:#f5f6fa; color:#18191c; padding:20px; box-sizing:border-box; }
  .wrap { max-width:560px; margin:0 auto; }
  .card { background:#fff; border-radius:14px; padding:20px; margin-bottom:14px;
          box-shadow:0 2px 12px rgba(0,0,0,.05); }
  h1 { font-size:18px; margin:0 0 4px; }
  h2 { font-size:15px; margin:0 0 10px; }
  p.sub { font-size:13px; color:#61666d; margin:0 0 16px; }
  input { width:100%; box-sizing:border-box; padding:12px; font-size:15px;
          border:1px solid #e3e5e7; border-radius:8px; }
  button { width:100%; padding:13px; font-size:15px; font-weight:600; border:0;
           border-radius:9px; background:#00aeec; color:#fff; cursor:pointer; margin-top:10px; }
  button:disabled { background:#c9ccd0; cursor:not-allowed; }
  button.ghost { background:#f1f2f3; color:#18191c; }
  pre { background:#f6f7f8; border:1px solid #e3e5e7; border-radius:8px; padding:12px;
        font-size:12px; overflow-x:auto; white-space:pre-wrap; word-break:break-all; margin:0; }
  .err { color:#f25d8e; font-size:13px; margin-top:10px; }
  .ok  { color:#2ac864; font-size:13px; margin-top:10px; }
  .row { display:flex; gap:8px; align-items:center; }
  .muted { font-size:12px; color:#9499a0; }
  ol { padding-left:20px; font-size:14px; margin:0 0 12px; }
  li { margin-bottom:6px; }
</style>
</head>
<body>
<div class="wrap">

  <div class="card">
    <h1>认领你的玩具</h1>
    <p class="sub">认领后可以拿到 client_id，让你的玩具接入联机身份服务。</p>
    <input id="slug" placeholder="填入你的 toy slug，例如 1mZNSjKoPhPTe2JW" autocomplete="off">
    <button id="start">下一步</button>
    <div class="err" id="err"></div>
  </div>

  <div class="card" id="step2" hidden>
    <h2>第 2 步：把验证码写进你的玩具</h2>
    <div id="reuseNote" hidden
         style="background:#eef6ff;border:1px solid #cce4ff;color:#1a5c99;
                border-radius:8px;padding:10px 12px;font-size:13px;
                margin-bottom:12px;line-height:1.7"></div>
    <ol>
      <li>打开你的玩具源码，编辑 <code>index.html</code></li>
      <li>把下面这行加到 <code>&lt;head&gt;</code> 里任意位置</li>
      <li>保存并发布，然后回来点验证</li>
    </ol>
    <pre id="snippet"></pre>
    <button id="verify">我已发布，开始验证</button>
    <div class="muted" style="margin-top:10px">
      验证通过后可以删掉这行，不影响已完成的认领。
    </div>
    <div class="err" id="err2"></div>
  </div>

  <div class="card" id="step3" hidden>
    <h2>认领成功 🎉</h2>
    <p class="sub">这是你的 client_id，填进玩具里用来发起过桥。</p>
    <pre id="clientId"></pre>
    <div class="ok" id="done"></div>
  </div>

</div>

<script>
// ⚠️ 部署前改成你的 API 地址（必须是 https，且是外网可达的域名）
const API_BASE = 'https://www.oxth.com:8443'

// 这两个是最常见的配置错误，而且症状是浏览器报一句没头没脑的 "Load failed"。
// 与其让人去猜，不如直接把原因写在页面上。
;(function guardApiBase() {
  const problems = []
  if (/\/\/(127\.0\.0\.1|localhost)(:|\/|$)/.test(API_BASE)) {
    problems.push('API_BASE 指向 127.0.0.1 —— 那指的是<b>访问者自己的设备</b>，不是你的服务器')
  }
  if (location.protocol === 'https:' && /^http:\/\//.test(API_BASE)) {
    problems.push('API_BASE 是 http，而玩具页面是 https —— 会被浏览器按混合内容拦截')
  }
  if (!problems.length) return
  const el = document.createElement('div')
  el.style.cssText =
    'background:#fff3cd;border:1px solid #ffe69c;color:#664d03;padding:12px;' +
    'border-radius:8px;margin-bottom:14px;font-size:13px;line-height:1.8'
  el.innerHTML = '<b>⚠️ API 地址没配好（仅开发者可见）</b><br>' + problems.join('<br>')
  document.body.insertBefore(el, document.body.firstChild)
})()

const $ = (id) => document.getElementById(id)
let profile = null

/**
 * 记住上次填的 slug。认领要改玩具并重新发布，中途退出很正常，
 * 回到这一页不应该从零开始。slug 是公开信息，存着没有风险。
 */
const SLUG_KEY = 'xmeta:claim:slug'

try {
  const saved = localStorage.getItem(SLUG_KEY)
  if (saved) {
    $('slug').value = saved
    $('start').textContent = '继续认领'
  }
} catch (e) { /* 隐私模式下写不了，忽略 */ }

async function post(path, body) {
  let res
  try {
    res = await fetch(API_BASE + path, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    })
  } catch (e) {
    // 浏览器原生的报错是 "Load failed" / "Failed to fetch"，没有任何上下文
    throw new Error(
      `连不上 ${API_BASE}（${e.message || e}）。` +
        '检查这个地址是否外网可达、是否为 HTTPS。'
    )
  }
  const json = await res.json().catch(() => ({}))
  if (!res.ok) throw new Error(json?.error?.message || ('HTTP ' + res.status))
  return json
}

/** 认领必须绑在一个具体的 toyOpenId 上，所以先拿身份 */
async function ensureProfile() {
  if (profile) return profile
  if (!(await toy.isSupport('getUserProfile'))) {
    throw new Error('当前环境不支持获取用户信息，请在 B站 App 内打开本页')
  }
  const p = await toy.getUserProfile()
  if (!p.toyOpenId) {
    throw new Error('这个玩具没有开启 OpenID 模式，认领功能不可用')
  }
  profile = p
  return p
}

$('start').addEventListener('click', async () => {
  const slug = $('slug').value.trim()
  $('err').textContent = ''
  if (!slug) { $('err').textContent = '请填写 slug'; return }

  $('start').disabled = true
  try {
    const p = await ensureProfile()
    const res = await post('/api/claim/start', {
      slug,
      toyOpenId: p.toyOpenId,
      nickname: p.nickname,
      avatar: p.avatar
    })

    if (res.state === 'verified') {
      $('clientId').textContent = res.clientId || '(无)'
      $('done').textContent = res.message || '这个玩具已经归你所有'
      $('step3').hidden = false
      $('step2').hidden = true
      return
    }

    try { localStorage.setItem(SLUG_KEY, slug) } catch (e) { /* 忽略 */ }

    // 同一个用户 + 同一个玩具，有效期内 nonce 不会变。
    // 说清楚这一点，免得他以为要重新发布一次。
    if (res.reused) {
      $('reuseNote').hidden = false
      const left = res.expiresAt
        ? Math.round((new Date(res.expiresAt) - Date.now()) / 3600000)
        : null
      $('reuseNote').innerHTML =
        '这是你上次拿到的验证码，<b>没有变</b>，不用重新发布。' +
        (left !== null && left > 0 ? `还剩约 ${left} 小时有效。` : '') +
        '<br>如果你已经把它写进玩具了，直接点下面的验证即可。'
    } else {
      $('reuseNote').hidden = true
    }

    $('snippet').textContent = res.instructions
    $('step2').hidden = false
  } catch (e) {
    $('err').textContent = e.message || String(e)
    $('start').disabled = false
  }
})

$('verify').addEventListener('click', async () => {
  const slug = $('slug').value.trim()
  $('err2').textContent = ''
  $('verify').disabled = true
  try {
    const p = await ensureProfile()
    const res = await post('/api/claim/verify', {
      slug,
      toyOpenId: p.toyOpenId,
      nickname: p.nickname,
      avatar: p.avatar
    })
    $('clientId').textContent = res.clientId || '(无)'
    $('done').textContent = '把这个 client_id 填进你的玩具即可开始接入。'
    $('step2').hidden = true
    $('step3').hidden = false
  } catch (e) {
    $('err2').textContent = e.message || String(e)
    $('verify').disabled = false
  }
})
</script>
</body>
</html>
