<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>我的身份</title>
<link rel="stylesheet" href="xmeta-ui.css">
<script src="//s1.hdslb.com/bfs/seed/toy/app/sdk/toy-sdk.js"></script>
</head>
<body class="xm xm--with-nav">

<!-- 顶部栏 -->
<header class="xm-topbar">
  <button class="xm-topbar__back" onclick="history.back()" aria-label="返回">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
  </button>
  <h1 class="xm-topbar__title">我的身份</h1>
  <div class="xm-topbar__right"></div>
</header>

<div class="xm-page">

  <!-- ① 说明 -->
  <section id="s-intro">
    <div class="xm-hero xm-rise">
      <div class="xm-brandmark" aria-hidden="true">
        <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 12 L28 28" stroke="#fff" stroke-width="4.5" stroke-linecap="round"/>
          <path d="M28 12 L12 28" stroke="#fff" stroke-width="4.5" stroke-linecap="round" opacity=".82"/>
          <circle cx="20" cy="20" r="2.6" fill="#fff"/>
        </svg>
      </div>
      <h1 class="xm-hero__name">我的联机身份</h1>
      <p class="xm-hero__ask">看看你的身份，以及它在哪些 toy 上被用过。</p>
    </div>
    <p class="xm-note xm-mt-lg" style="margin-top:28px">
      点下面的按钮会请求一次你的公开资料（昵称、头像）来确认身份。
      平台会弹出确认框，你也可以拒绝。
    </p>
    <div class="xm-actions xm-mt-lg">
      <button class="xm-btn xm-btn--primary" id="btnStart">查看我的身份</button>
    </div>
  </section>

  <!-- ② 加载 -->
  <section id="s-loading" class="xm-hidden">
    <div class="xm-loading"><span class="xm-spinner"></span>正在读取…</div>
  </section>

  <!-- ③ 内容 -->
  <section id="s-main" class="xm-hidden">

    <div class="xm-card xm-rise" style="display:flex;align-items:center;gap:15px">
      <img class="xm-avatar" id="avatar" alt="" hidden>
      <div style="flex:1;min-width:0">
        <div style="font-size:19px;font-weight:750;letter-spacing:-.015em" id="nickname">—</div>
        <div class="xm-small xm-mono" id="uidLine"></div>
      </div>
    </div>

    <section id="secOwned" class="xm-hidden xm-mt-lg">
      <p class="xm-label">我认领的 toy</p>
      <div class="xm-card" style="padding-top:6px;padding-bottom:6px">
        <div id="ownedList"></div>
      </div>
    </section>

    <section id="secUsage" class="xm-hidden xm-mt-lg">
      <p class="xm-label">身份使用记录</p>
      <div class="xm-card" style="padding-top:6px;padding-bottom:6px">
        <div id="usageList"></div>
      </div>
    </section>

    <div class="xm-empty xm-hidden" id="emptyNote">
      <div class="xm-empty__glyph">⌁</div>
      还没有任何记录。去一款接入 xmeta 的游戏里点「开启联机」试试。
    </div>

    <div class="xm-actions xm-mt-lg">
      <button class="xm-btn xm-btn--quiet" id="btnRefresh">刷新</button>
    </div>

    <div class="xm-foot">
      <span class="xm-brand"><span class="xm-brand__dot"></span>xmeta 身份服务</span>
    </div>
  </section>

  <!-- 出错 -->
  <section id="s-error" class="xm-hidden">
    <div class="xm-empty">
      <div class="xm-empty__glyph">!</div>
      <div class="xm-alert xm-alert--error" id="errBox"></div>
    </div>
    <div class="xm-actions">
      <button class="xm-btn xm-btn--ghost" id="btnRetry">重试</button>
    </div>
  </section>

  <div id="devWarn" class="xm-alert xm-alert--warn xm-hidden"></div>
</div>

<!-- 底部导航 -->
<nav class="xm-bottomnav">
  <a class="xm-bottomnav__item" href="index.html">
    <svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20h14V9.5"/></svg>
    <span>首页</span>
  </a>
  <a class="xm-bottomnav__item is-active" href="me.html">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
    <span>身份</span>
  </a>
  <a class="xm-bottomnav__item" href="claim.html">
    <svg viewBox="0 0 24 24"><path d="M12 2v20"/><path d="M2 12h20"/></svg>
    <span>认领</span>
  </a>
</nav>

<script>
// ⚠️ 部署前改成你的 API 地址
const API_BASE = 'https://www.oxth.com:8443'

;(function guardApiBase() {
  const problems = []
  if (/\/\/(127\.0\.0\.1|localhost)(:|\/|$)/.test(API_BASE)) {
    problems.push('API_BASE 指向 127.0.0.1 —— 那指的是访问者自己的设备，不是你的服务器')
  }
  if (location.protocol === 'https:' && /^http:\/\//.test(API_BASE)) {
    problems.push('API_BASE 是 http，而 toy 页面是 https —— 会被浏览器按混合内容拦截')
  }
  if (!problems.length) return
  const el = document.getElementById('devWarn')
  el.classList.remove('xm-hidden')
  el.innerHTML = '<b>⚠️ API 地址没配好（仅开发者可见）</b><br>' + problems.join('<br>')
})()

const $ = (id) => document.getElementById(id)
const SECTIONS = ['s-intro', 's-loading', 's-main', 's-error']

// 缓存按 toyOpenId 的哈希分桶 —— 同一台设备可能有多个 B站 账号。
// 用哈希而不是明文，是因为 localStorage 的 key 在 DevTools 里一眼可见，
// 而 toyOpenId 是密钥级数据。
const CACHE_PREFIX = 'xmeta:me:'
const OK_KEY = 'xmeta:me:ok'
const CACHE_TTL_MS = 24 * 60 * 60 * 1000

const show = (name) => SECTIONS.forEach((s) => $(s).classList.toggle('xm-hidden', s !== name))

function escapeHtml(s) {
  return String(s).replace(/[<>&"]/g, (c) =>
    ({ '<': '&lt;', '>': '&gt;', '&': '&amp;', '"': '&quot;' }[c]))
}

function hashKey(s) {
  let h = 2166136261
  for (let i = 0; i < s.length; i++) {
    h ^= s.charCodeAt(i)
    h = Math.imul(h, 16777619)
  }
  return (h >>> 0).toString(36)
}

function readCache(id) {
  try {
    const v = JSON.parse(localStorage.getItem(CACHE_PREFIX + hashKey(id)) || 'null')
    if (!v || !v.ts || Date.now() - v.ts > CACHE_TTL_MS) return null
    return v.data
  } catch (e) { return null }
}

function writeCache(id, data) {
  try {
    localStorage.setItem(CACHE_PREFIX + hashKey(id), JSON.stringify({ ts: Date.now(), data }))
  } catch (e) { /* 忽略 */ }
}

function fail(message, detail) {
  $('errBox').innerHTML =
    escapeHtml(message) +
    (detail ? '<br><br><span class="xm-mono">' + escapeHtml(detail) + '</span>' : '')
  show('s-error')
}

async function request(path, options) {
  let res
  try {
    res = await fetch(API_BASE + path, options)
  } catch (e) {
    throw new Error('连不上 ' + API_BASE + '（' + (e.message || e) + '）。请检查网络后重试。')
  }
  const json = await res.json().catch(() => ({}))
  if (!res.ok) throw new Error((json && json.error && json.error.message) || ('HTTP ' + res.status))
  return json
}

function timeAgo(iso) {
  const d = new Date(iso)
  if (isNaN(d)) return ''
  const min = Math.floor((Date.now() - d.getTime()) / 60000)
  if (min < 1) return '刚刚'
  if (min < 60) return min + ' 分钟前'
  const h = Math.floor(min / 60)
  if (h < 24) return h + ' 小时前'
  const day = Math.floor(h / 24)
  if (day < 30) return day + ' 天前'
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') +
    '-' + String(d.getDate()).padStart(2, '0')
}

// ─────────────────────────────────────────────────────────────
function itemHtml(iconUrl, title, meta, tag) {
  const icon = iconUrl
    ? '<img class="xm-item__icon" src="' + escapeHtml(iconUrl) + '" alt="" referrerpolicy="no-referrer" onerror="this.style.display=\'none\'">'
    : '<div class="xm-item__icon"></div>'
  return '<div class="xm-item">' + icon +
    '<div class="xm-item__body">' +
      '<div class="xm-item__title">' + escapeHtml(title) + '</div>' +
      '<div class="xm-item__meta">' + escapeHtml(meta) + '</div>' +
    '</div>' + (tag || '') + '</div>'
}

function render(data) {
  const u = data.user

  if (!u) {
    $('nickname').textContent = '新身份'
    $('uidLine').textContent = ''
    $('avatar').hidden = true
    $('secOwned').classList.add('xm-hidden')
    $('secUsage').classList.add('xm-hidden')
    $('emptyNote').classList.remove('xm-hidden')
    show('s-main')
    return
  }

  if (u.avatar) { $('avatar').src = u.avatar; $('avatar').hidden = false }
  $('nickname').textContent = u.nickname || '(无昵称)'
  $('uidLine').textContent = 'uid ' + u.uid + ' · ' + timeAgo(u.joinedAt) + '加入'

  // 作者视角
  if (data.ownedToys.length) {
    $('secOwned').classList.remove('xm-hidden')
    $('ownedList').innerHTML = data.ownedToys.map((t) => {
      let tag
      if (t.pendingClaim) tag = '<span class="xm-tag">认领中</span>'
      else if (t.clientRevoked) tag = '<span class="xm-tag xm-tag--muted">已停用</span>'
      else tag = '<span class="xm-tag xm-tag--ok">已认领</span>'

      // 作者可以手动刷新 toy 的图标 / 作者名等元数据
      const refreshBtn =
        '<button class="xm-tag xm-tag--btn" data-refresh-slug="' + escapeHtml(t.slug) +
        '">刷新</button>'

      let meta = t.slug
      if (t.clientId) meta += ' · ' + t.clientId
      if (t.pendingClaim) {
        const hours = Math.max(0,
          Math.round((new Date(t.pendingClaim.expiresAt) - Date.now()) / 3600000))
        meta += ' · 验证码剩 ' + hours + ' 小时 / 可试 ' + t.pendingClaim.attemptsLeft + ' 次'
      }
      return itemHtml(t.iconUrl, t.title || t.slug, meta, tag + refreshBtn)
    }).join('')
  } else {
    $('secOwned').classList.add('xm-hidden')
  }

  // 用户视角
  if (data.usage.length) {
    $('secUsage').classList.remove('xm-hidden')
    $('usageList').innerHTML = data.usage.map((t) => {
      const meta = '最近 ' + timeAgo(t.lastUsedAt) + ' · 共 ' + t.uses + ' 次'
      const tag = t.revokedAt
        ? '<span class="xm-tag xm-tag--muted">已退出</span>'
        : t.clientId
          ? '<button class="xm-tag xm-tag--btn" data-cid="' + escapeHtml(t.clientId) + '">退出</button>'
          : ''
      return itemHtml(t.iconUrl, t.title || t.slug, meta, tag)
    }).join('')
  } else {
    $('secUsage').classList.add('xm-hidden')
  }

  $('emptyNote').classList.toggle('xm-hidden',
    data.ownedToys.length > 0 || data.usage.length > 0)
  show('s-main')
}

// ─────────────────────────────────────────────────────────────
let loading = false
let currentProfile = null

async function load() {
  if (loading) return
  loading = true
  show('s-loading')
  try {
    if (!(await toy.isSupport('getUserProfile'))) {
      throw new Error('当前环境不支持获取用户信息，请在 B站 App 内或电脑浏览器打开。')
    }

    // 到这里平台已经授权过，不会重复弹窗
    const profile = await toy.getUserProfile()
    if (!profile.toyOpenId) throw new Error('这款 toy 没有开启 OpenID 模式，个人中心不可用。')
    currentProfile = profile

    // 先拿缓存渲染，网络那趟慢慢来
    const cached = readCache(profile.toyOpenId)
    if (cached) render(cached)

    const fresh = await request('/api/me', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ toyOpenId: profile.toyOpenId })
    })
    writeCache(profile.toyOpenId, fresh)
    render(fresh)

    try { localStorage.setItem(OK_KEY, '1') } catch (e) { /* 忽略 */ }
  } catch (e) {
    fail('没能读取身份信息。', e.message || String(e))
  } finally {
    loading = false
  }
}

// 之前授权过的设备直接加载；没有就先看说明再点按钮，
// 免得一进页面就被平台弹授权框。
let seenOk = false
try { seenOk = localStorage.getItem(OK_KEY) === '1' } catch (e) { /* 忽略 */ }

if (seenOk) {
  load()
} else {
  show('s-intro')
  $('btnStart').addEventListener('click', () => { $('btnStart').disabled = true; load() })
}

$('btnRefresh').addEventListener('click', () => load())
$('btnRetry').addEventListener('click', () => load())

// ── 手动失活：退出某个 toy ──
// 事件委托，因为列表是每次渲染重建的
$('usageList').addEventListener('click', async (e) => {
  const btn = e.target.closest('[data-cid]')
  if (!btn || !currentProfile) return

  const name = btn.closest('.xm-item')?.querySelector('.xm-item__title')?.textContent
  if (!confirm('退出《' + (name || '这个 toy') + '》？\n\n之前签发的 token 会立即失效，' +
               '下次要玩得重新授权一次。')) return

  btn.disabled = true
  try {
    await request('/api/me/revoke', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        toyOpenId: currentProfile.toyOpenId,
        cid: btn.getAttribute('data-cid')
      })
    })
    await load()
  } catch (err) {
    fail('退出失败。', err.message || String(err))
    btn.disabled = false
  }
})

// ── 手动刷新 toy 元数据（图标 / 作者名等）──
$('ownedList').addEventListener('click', async (e) => {
  const btn = e.target.closest('[data-refresh-slug]')
  if (!btn || !currentProfile) return

  btn.disabled = true
  const orig = btn.textContent
  btn.textContent = '刷新中…'
  try {
    await request('/api/toy/refresh', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        toyOpenId: currentProfile.toyOpenId,
        slug: btn.getAttribute('data-refresh-slug')
      })
    })
    await load()
  } catch (err) {
    fail('刷新失败。', err.message || String(err))
    btn.disabled = false
    btn.textContent = orig
  }
})
</script>
</body>
</html>
