<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>过桥授权</title>
<!-- 官方 SDK -->
<script src="//s1.hdslb.com/bfs/seed/toy/app/sdk/toy-sdk.js"></script>
<style>
  :root { color-scheme: light dark; }
  body { margin:0; font:16px/1.6 system-ui,-apple-system,"PingFang SC",sans-serif;
         display:flex; align-items:center; justify-content:center; min-height:100vh;
         background:#f5f6fa; color:#18191c; padding:24px; box-sizing:border-box; }
  .card { background:#fff; border-radius:16px; padding:28px 24px; max-width:420px; width:100%;
          box-shadow:0 4px 24px rgba(0,0,0,.06); text-align:center; }
  .icon { width:72px; height:72px; border-radius:16px; object-fit:cover; background:#eef0f4; }
  h1 { font-size:18px; margin:16px 0 6px; }
  p  { font-size:14px; color:#61666d; margin:0 0 20px; }
  button { width:100%; padding:14px; font-size:16px; font-weight:600; border:0;
           border-radius:10px; background:#00aeec; color:#fff; cursor:pointer; }
  button:disabled { background:#c9ccd0; cursor:not-allowed; }
  button.ghost { background:#f1f2f3; color:#18191c; margin-top:10px; }
  .hint { font-size:12px; color:#9499a0; margin-top:14px; word-break:break-all; }
  .err  { color:#f25d8e; font-size:14px; margin-top:12px; }
</style>
</head>
<body>
<div class="card">
  <img class="icon" id="icon" alt="" hidden>
  <h1 id="title">正在加载…</h1>
  <p id="desc"></p>
  <button id="go" disabled>开始联机</button>
  <button id="back" class="ghost" hidden>返回游戏</button>
  <div class="hint" id="hint"></div>
  <div class="err" id="err"></div>
</div>

<script>
// ⚠️ 部署前改成你的 API 地址（必须是 https，且是外网可达的域名）
const API_BASE = 'https://www.oxth.com:8443'

// 这两个是最常见的配置错误，症状是浏览器报一句没头没脑的 "Load failed"。
;(function guardApiBase() {
  const problems = []
  if (/\/\/(127\.0\.0\.1|localhost)(:|\/|$)/.test(API_BASE)) {
    problems.push('API_BASE 指向 127.0.0.1 —— 那指的是<b>访问者自己的设备</b>，不是你的服务器')
  }
  if (location.protocol === 'https:' && /^http:\/\//.test(API_BASE)) {
    problems.push('API_BASE 是 http，而玩具页面是 https —— 会被浏览器按混合内容拦截')
  }
  if (!problems.length) return
  const el = document.createElement('div')
  el.style.cssText =
    'background:#fff3cd;border:1px solid #ffe69c;color:#664d03;padding:12px;' +
    'border-radius:8px;margin-bottom:14px;font-size:13px;line-height:1.8;text-align:left'
  el.innerHTML = '<b>⚠️ API 地址没配好（仅开发者可见）</b><br>' + problems.join('<br>')
  document.body.insertBefore(el, document.body.firstChild)
})()

const qs = new URLSearchParams(location.search)

const REQ_KEY = 'xmeta:req'        // 发起方写的：{ cid, cc, st, ts }
const RES_KEY = 'xmeta:res'        // 我写回给它的：{ code, st, returnSlug, ts }
const SHARED_TTL_MS = 3 * 60 * 1000

// 参数优先取 URL。但 B站 App 里 toy.navigate 走原生通道，实测**不会
// 透传 extra**（目标页只收到原生加的 from_spmid），所以拿不到时回落到
// localStorage：所有玩具的内层 iframe 都在 www.bilibilitoy.com 这一个
// 源下，发起方会把 { cid, cc, st } 写在那里。
let CID = qs.get('cid')            // 第三方 toy 的 client_id
let CC  = qs.get('cc')             // PKCE challenge
let ST  = qs.get('st')             // 第三方 toy 的 state，原样带回

function readShared(key) {
  try {
    const v = JSON.parse(localStorage.getItem(key) || 'null')
    if (!v || typeof v !== 'object' || !v.ts) return null
    if (Date.now() - v.ts > SHARED_TTL_MS) return null
    return v
  } catch (e) {
    return null
  }
}

function writeShared(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)) } catch (e) { /* 忽略 */ }
}

if (!CID) {
  const req = readShared(REQ_KEY)
  if (req && req.cid) {
    CID = req.cid
    CC  = req.cc
    ST  = req.st
  }
}

const $ = (id) => document.getElementById(id)
let pendingReturn = null

function fail(msg) { $('err').textContent = msg }

async function post(path, body) {
  let res
  try {
    res = await fetch(API_BASE + path, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    })
  } catch (e) {
    throw new Error(
      `连不上 ${API_BASE}（${e.message || e}）。` +
        '检查这个地址是否外网可达、是否为 HTTPS。'
    )
  }
  const json = await res.json().catch(() => ({}))
  if (!res.ok) throw new Error(json?.error?.message || ('HTTP ' + res.status))
  return json
}

async function getJson(path) {
  let res
  try {
    res = await fetch(API_BASE + path)
  } catch (e) {
    throw new Error(
      `连不上 ${API_BASE}（${e.message || e}）。` +
        '检查这个地址是否外网可达、是否为 HTTPS。'
    )
  }
  const json = await res.json().catch(() => ({}))
  if (!res.ok) throw new Error(json?.error?.message || ('HTTP ' + res.status))
  return json
}

// 1. 确认 client_id 有效，展示是哪个玩具在要身份
;(async function loadContext() {
  if (!CID) {
    // 这个页面只能从玩具里跳过来。直接打开必然缺参数，
    // 所以要明确说清楚，别让人以为是坏了。
    $('title').textContent = '缺少参数'
    $('desc').textContent =
      '这一页不能直接打开。请回到游戏里点「开启联机」，' +
      '由游戏跳转过来才会带上必要参数。'
    $('hint').textContent = '当前地址缺少 cid 参数'
    return
  }
  try {
    const json = await getJson('/api/bridge/context?cid=' + encodeURIComponent(CID))
    $('title').textContent = `《${json.title || json.slug}》想获取你的身份`
    $('desc').textContent = '仅用于在这款游戏中识别你，不会拿到你的 B站 账号信息。'
    if (json.iconUrl) { $('icon').src = json.iconUrl; $('icon').hidden = false }
    $('go').disabled = false
  } catch (e) {
    fail(e.message)
  }
})()

// 2. 用户手势里调 getUserProfile（平台会弹确认框）
$('go').addEventListener('click', async () => {
  $('go').disabled = true
  $('err').textContent = ''
  try {
    const supported = await toy.isSupport('getUserProfile')
    if (!supported) throw new Error('当前环境不支持获取用户信息，请在 B站 App 内打开')

    const profile = await toy.getUserProfile()
    if (!profile.toyOpenId) {
      throw new Error('这个玩具没有开启 OpenID 模式，拿不到用户标识')
    }

    const res = await post('/api/bridge/authorize', {
      cid: CID,
      cc: CC,
      st: ST,
      toyOpenId: profile.toyOpenId,
      nickname: profile.nickname,
      avatar: profile.avatar
    })

    pendingReturn = res
    $('desc').textContent = '授权成功。点击下面按钮回到《' +
      (res.returnToyTitle || res.returnSlug) + '》继续。'
    $('go').hidden = true
    $('back').hidden = false
    $('hint').textContent = '授权码 ' + res.expiresIn + ' 秒内有效'
  } catch (e) {
    fail(e.message || String(e))
    $('go').disabled = false
  }
})

// 3. navigate 必须在用户手势中调用，所以这里必须是独立的一次点击
$('back').addEventListener('click', async () => {
  if (!pendingReturn) return
  $('back').disabled = true
  try {
    // App 内回跳同样带不了 extra，所以把结果写进共享存储。
    // 必须在真正跳转前才写 —— 写早了的话，发起方页面若还活着会
    // 提前把 code 消费掉，等它跳回重载时就什么都拿不到了。
    writeShared(RES_KEY, {
      code: pendingReturn.code,
      st: ST || '',
      returnSlug: pendingReturn.returnSlug,
      ts: Date.now()
    })

    await toy.navigate({
      type: 'toy',
      id: pendingReturn.returnSlug,
      extra: { code: pendingReturn.code, st: ST || '' }
    })
  } catch (e) {
    fail('跳转失败：' + (e.message || e))
    $('back').disabled = false
  }
})
</script>
</body>
</html>
