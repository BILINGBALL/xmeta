<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>身份授权</title>
<link rel="stylesheet" href="xmeta-ui.css">
<script src="//s1.hdslb.com/bfs/seed/toy/app/sdk/toy-sdk.js"></script>
</head>
<body class="xm">

<!-- 顶部栏 -->
<header class="xm-topbar">
  <button class="xm-topbar__back" id="btnTopBack" aria-label="返回">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
  </button>
  <h1 class="xm-topbar__title">身份授权</h1>
  <div class="xm-topbar__right"></div>
</header>

<div class="xm-page xm-page--center">

  <!-- ① 加载 -->
  <section id="s-loading" class="xm-rise">
    <div class="xm-loading"><span class="xm-spinner"></span>正在加载…</div>
  </section>

  <!-- ② 说明 —— 授权之前先讲清楚，但只讲要点 -->
  <section id="s-consent" class="xm-hidden">
    <div class="xm-hero xm-rise">
      <div class="xm-hero__ring" id="ring"></div>
      <h1 class="xm-hero__name" id="toyName">—</h1>
      <p class="xm-hero__ask">想认识你</p>
    </div>

    <div class="xm-card xm-mt-lg xm-rise xm-rise--2">
      <div class="xm-facts">
        <div class="xm-fact">
          <div class="xm-fact__k">会拿到</div>
          <div class="xm-fact__v">昵称 · 头像 · 一个<b>匿名标识</b></div>
        </div>
        <div class="xm-fact xm-fact--deny">
          <div class="xm-fact__k">不会拿到</div>
          <div class="xm-fact__v">B站 账号 · UID · 你在其它 toy 的数据</div>
        </div>
        <div class="xm-fact">
          <div class="xm-fact__k">用来</div>
          <div class="xm-fact__v">在这款游戏里认出你，保存进度</div>
        </div>
      </div>
    </div>

    <p class="xm-note xm-mt">
      这个身份由 xmeta 统一管理，之后玩其它接入 xmeta 的游戏可以沿用，
      不用重复授权。
    </p>

    <div class="xm-mt-lg xm-rise xm-rise--3">
      <p class="xm-label">这次授权有效多久</p>
      <div class="xm-seg" id="ttlSeg">
        <label class="xm-seg__opt"><input type="radio" name="ttl" value="3">3 小时</label>
        <label class="xm-seg__opt"><input type="radio" name="ttl" value="6" checked>6 小时</label>
        <label class="xm-seg__opt"><input type="radio" name="ttl" value="12">12 小时</label>
        <label class="xm-seg__opt"><input type="radio" name="ttl" value="24">24 小时</label>
      </div>
      <p class="xm-small xm-mt">
        到期后回这里再授权一次。想提前结束，去「我的身份」里操作。
      </p>
    </div>

    <div class="xm-actions">
      <button class="xm-btn xm-btn--primary" id="btnAllow">允许</button>
      <button class="xm-btn xm-btn--ghost" id="btnDeny">拒绝</button>
    </div>
    <p class="xm-small xm-mt xm-hidden" id="denyHint" style="color:var(--xm-danger)"></p>
  </section>

  <!-- ③ 等授权 / 签发 -->
  <section id="s-working" class="xm-hidden">
    <div class="xm-loading"><span class="xm-spinner"></span><span id="workingText">正在获取授权…</span></div>
  </section>

  <!-- ④ 成功 -->
  <section id="s-done" class="xm-hidden">
    <div class="xm-hero xm-rise">
      <div class="xm-hero__ring" id="ringDone"></div>
      <h1 class="xm-hero__name" id="doneName">—</h1>
      <p class="xm-hero__ask" style="color:var(--xm-ok)">已经认识你了</p>
    </div>
    <div class="xm-actions">
      <button class="xm-btn xm-btn--primary" id="btnBack">返回游戏</button>
    </div>
    <p class="xm-small xm-mt xm-hidden" id="backHint" style="color:var(--xm-danger)"></p>
  </section>

  <!-- ⑤ 出错 -->
  <section id="s-error" class="xm-hidden">
    <div class="xm-empty">
      <div class="xm-empty__glyph">!</div>
      <div class="xm-alert xm-alert--error" id="errBox"></div>
    </div>
    <div class="xm-actions">
      <button class="xm-btn xm-btn--ghost" id="btnRetry">重试</button>
    </div>
  </section>

  <!-- 配置错误时出现（仅开发者会看到） -->
  <div id="devWarn" class="xm-alert xm-alert--warn xm-hidden xm-mt-lg"></div>
</div>

<script>
// ⚠️ 部署前改成你的 API 地址（必须是 https，且是外网可达的域名）
const API_BASE = 'https://www.oxth.com:8443'

;(function guardApiBase() {
  const problems = []
  if (/\/\/(127\.0\.0\.1|localhost)(:|\/|$)/.test(API_BASE)) {
    problems.push('API_BASE 指向 127.0.0.1 —— 那指的是<b>访问者自己的设备</b>，不是你的服务器')
  }
  if (location.protocol === 'https:' && /^http:\/\//.test(API_BASE)) {
    problems.push('API_BASE 是 http，而 toy 页面是 https —— 会被浏览器按混合内容拦截')
  }
  if (!problems.length) return
  const el = document.getElementById('devWarn')
  el.classList.remove('xm-hidden')
  el.innerHTML = '<b>⚠️ API 地址没配好（仅开发者可见）</b><br>' + problems.join('<br>')
})()

// ─────────────────────────────────────────────────────────────
// 参数：URL 优先，拿不到时回落 localStorage
// App 内 toy.navigate 走原生通道，实测不透传 extra，所以发起方
// 会把参数另写一份到共享存储（所有 toy 的内层 iframe 同源）。
// ─────────────────────────────────────────────────────────────
const REQ_KEY = 'xmeta:req'
const RES_KEY = 'xmeta:res'
const SHARED_TTL_MS = 3 * 60 * 1000

const qs = new URLSearchParams(location.search)
let CID = qs.get('cid')
let CC  = qs.get('cc')
let ST  = qs.get('st')

function readShared(key) {
  try {
    const v = JSON.parse(localStorage.getItem(key) || 'null')
    if (!v || typeof v !== 'object' || !v.ts) return null
    if (Date.now() - v.ts > SHARED_TTL_MS) return null
    return v
  } catch (e) { return null }
}
function writeShared(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)) } catch (e) { /* 忽略 */ }
}

if (!CID) {
  const req = readShared(REQ_KEY)
  if (req && req.cid) {
    CID = req.cid
    CC  = req.cc
    ST  = req.st
    // 标记「已接手」。index.html 看到 claimed 就不再转发 ——
    // 否则用户在这之后直接打开中心 toy，会被这个旧请求弹回过桥页。
    // 数据留着，这样刷新本页仍然可用。
    try {
      req.claimed = true
      localStorage.setItem(REQ_KEY, JSON.stringify(req))
    } catch (e) { /* 忽略 */ }
  }
}

// ─────────────────────────────────────────────────────────────
const $ = (id) => document.getElementById(id)
const SECTIONS = ['s-loading', 's-consent', 's-working', 's-done', 's-error']

const show = (name) => SECTIONS.forEach((s) => $(s).classList.toggle('xm-hidden', s !== name))

function escapeHtml(s) {
  return String(s).replace(/[<>&]/g, (c) => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;' }[c]))
}

function fail(message, detail) {
  $('errBox').innerHTML =
    escapeHtml(message) +
    (detail ? '<br><br><span class="xm-mono">' + escapeHtml(detail) + '</span>' : '')
  show('s-error')
}

/** 图标放进圆环；没有图标就用标题首字顶上 */
function paintRing(el, title, iconUrl) {
  if (iconUrl) {
    const img = document.createElement('img')
    img.alt = ''
    // B站 CDN 可能按 Referer 防盗链，toy 页面的来源它不认，
    // 不带 Referer 反而能加载。
    img.referrerPolicy = 'no-referrer'
    // 加载失败就退回首字，别留个裂图在那。
    img.onerror = () => {
      el.textContent = (String(title || '?').trim()[0] || '?').toUpperCase()
      el.classList.add('xm-hero__ring--empty')
    }
    img.src = iconUrl
    el.innerHTML = ''
    el.appendChild(img)
    el.classList.remove('xm-hero__ring--empty')
  } else {
    el.textContent = (String(title || '?').trim()[0] || '?').toUpperCase()
    el.classList.add('xm-hero__ring--empty')
  }
}

let ctx = null
let pendingReturn = null

// ── 授权时长分段选择 ──
// 不用 CSS :has()，老 WebView 支持不稳，改成手动同步 data-checked
const TTL_OPTS = document.querySelectorAll('#ttlSeg .xm-seg__opt')

function syncSeg() {
  TTL_OPTS.forEach((label) => {
    label.setAttribute('data-checked', String(label.querySelector('input').checked))
  })
}

function selectedTtl() {
  const el = document.querySelector('#ttlSeg input:checked')
  return el ? Number(el.value) : 6
}

TTL_OPTS.forEach((label) => {
  label.querySelector('input').addEventListener('change', syncSeg)
})
syncSeg()

async function request(path, options) {
  let res
  try {
    res = await fetch(API_BASE + path, options)
  } catch (e) {
    throw new Error('连不上 ' + API_BASE + '（' + (e.message || e) + '）。请检查网络后重试。')
  }
  const json = await res.json().catch(() => ({}))
  if (!res.ok) throw new Error((json && json.error && json.error.message) || ('HTTP ' + res.status))
  return json
}

const post = (path, body) =>
  request(path, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  })

// ── 启动：确认 client_id 有效，再展示说明 ──
async function boot() {
  show('s-loading')
  if (!CID) {
    fail('这一页不能直接打开。',
      '请回到游戏里点「开启联机」，由游戏跳转过来才会带上必要参数。')
    return
  }
  try {
    ctx = await request('/api/bridge/context?cid=' + encodeURIComponent(CID))
  } catch (e) {
    fail('无法确认是哪个游戏在请求授权。', e.message)
    return
  }

  const name = '《' + (ctx.title || ctx.slug) + '》'
  $('toyName').textContent = name
  $('doneName').textContent = name
  paintRing($('ring'), ctx.title || ctx.slug, ctx.iconUrl)
  paintRing($('ringDone'), ctx.title || ctx.slug, ctx.iconUrl)
  show('s-consent')
}

// ── 用户点了「允许」—— 到这里才真正去要授权 ──
$('btnAllow').addEventListener('click', async () => {
  $('btnAllow').disabled = true
  try {
    if (!(await toy.isSupport('getUserProfile'))) {
      throw new Error('当前环境不支持获取用户信息，请在 B站 App 内或电脑浏览器打开。')
    }

    $('workingText').textContent = '正在获取授权…'
    show('s-working')
    const profile = await toy.getUserProfile()

    if (!profile.toyOpenId) {
      throw new Error('这款游戏没有开启 OpenID 模式，暂时无法使用联机身份。')
    }

    $('workingText').textContent = '正在签发身份…'
    pendingReturn = await post('/api/bridge/authorize', {
      cid: CID,
      cc: CC,
      st: ST,
      ttl: selectedTtl(),
      toyOpenId: profile.toyOpenId,
      nickname: profile.nickname,
      avatar: profile.avatar
    })

    show('s-done')
  } catch (e) {
    fail('授权没有完成。', e.message || String(e))
    $('btnAllow').disabled = false
  }
})

/** 就地提示，不切页面 —— 切走会把人困在「重试 → 再点 → 又失败」的循环里 */
function showInline(id, msg) {
  const el = $(id)
  el.textContent = msg
  el.classList.remove('xm-hidden')
}

/** 和 SDK 内部的 at() 同构：拼出目标 toy 的地址。只为兜底用。 */
function toyUrl(slug, extra) {
  const url = location.protocol + '//www.bilibili.com/toy/' +
    encodeURIComponent(slug) + '/index.html'
  const qs = new URLSearchParams(extra || {}).toString()
  return qs ? url + '?' + qs : url
}

/** 出问题时把 userActivation 的状态带上，省得来回猜 */
function uaDiag() {
  const ua = navigator.userActivation
  if (!ua) return 'navigator.userActivation 不可用'
  return 'userActivation: isActive=' + ua.isActive + ', hasBeenActive=' + ua.hasBeenActive
}

/**
 * 跳到另一个 toy。
 *
 * 优先用 toy.navigate。但它会检查 navigator.userActivation.isActive ——
 * 那是**瞬时**状态，实机上出现过「明明是用户点的，检查却是 false」的情况
 * （点过一次拒绝之后重新授权，返回游戏必现）。
 *
 * SDK 自己在 navigate 内部本来就有 window.open 兜底，可那个检查在它之前
 * 就抛了，兜底永远走不到。所以这里自己走一遍同样的兜底 —— 对用户来说
 * 能跳回去就行，走哪条路无所谓。
 */
function navigateToToy(slug, extra, hintId) {
  toy.navigate({ type: 'toy', id: slug, extra: extra }).catch((e) => {
    let opened = null
    try { opened = window.open(toyUrl(slug, extra), '_blank') } catch (err) { /* 忽略 */ }
    if (opened) return // 兜底成功了

    showInline(hintId,
      '跳转没有成功（' + (e.message || e) + '）。请再点一次。\n' + uaDiag())
    console.warn('[xmeta] 跳转失败：', e, navigator.userActivation)
  })
}

// ── 「拒绝」：直接送回游戏，什么都不带 ──
//
// navigate 必须紧贴用户手势：SDK 会检查 navigator.userActivation.isActive，
// 那是瞬时状态 —— 中间插一次 await 就可能已经失效。所以这里不用 async。
$('btnDeny').addEventListener('click', () => {
  if (!ctx) return
  navigateToToy(ctx.slug, null, 'denyHint')
})

// 顶部返回键：和「拒绝」一样，直接送回游戏
$('btnTopBack').addEventListener('click', () => {
  if (!ctx) return
  navigateToToy(ctx.slug, null, 'denyHint')
})

// ── 返回游戏 ──
$('btnBack').addEventListener('click', () => {
  if (!pendingReturn) return

  // App 内回跳同样带不了 extra，所以结果也写一份到共享存储。
  // 必须真跳转前才写 —— 写早了，发起方页面若还活着会提前把 code
  // 消费掉，等它跳回重载时就什么都拿不到了。
  writeShared(RES_KEY, {
    code: pendingReturn.code,
    st: ST || '',
    returnSlug: pendingReturn.returnSlug,
    ts: Date.now()
  })

  navigateToToy(pendingReturn.returnSlug,
    { code: pendingReturn.code, st: ST || '' }, 'backHint')
})

$('btnRetry').addEventListener('click', () => boot())

boot()
</script>
</body>
</html>
