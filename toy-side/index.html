<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Toy 联机工具</title>
<script>
// 第三方玩具用 toy.navigate({type:'toy', id:'xmeta', extra:{cid,...}}) 跳过来时，
// 落点固定是 index.html，query 会被 B站 shell 原样转发到这一层。
// 所以这里必须先把带 cid 的请求转交给真正的过桥页。
window.__XMETA_HAD_CID__ = false
;(function () {
  var qs = new URLSearchParams(location.search)
  if (qs.get('cid')) {
    window.__XMETA_HAD_CID__ = true
    location.replace('bridge.html?' + location.search.slice(1))
  }
})()
</script>
<style>
  :root { color-scheme: light dark; }
  body { margin:0; font:15px/1.7 system-ui,-apple-system,"PingFang SC",sans-serif;
         background:#f5f6fa; color:#18191c; padding:24px; box-sizing:border-box; }
  .wrap { max-width:520px; margin:0 auto; }
  h1 { font-size:22px; margin:0 0 6px; }
  p.sub { font-size:14px; color:#61666d; margin:0 0 24px; }
  a.card { display:block; background:#fff; border-radius:14px; padding:18px 20px;
           margin-bottom:12px; text-decoration:none; color:inherit;
           box-shadow:0 2px 12px rgba(0,0,0,.05); }
  a.card h2 { font-size:16px; margin:0 0 4px; color:#18191c; }
  a.card span { font-size:13px; color:#61666d; }
  .arrow { float:right; color:#c9ccd0; font-size:20px; line-height:1.4; }
  .foot { font-size:12px; color:#9499a0; margin-top:24px; line-height:1.8; }
  code { background:#eef0f4; padding:1px 5px; border-radius:4px; font-size:12px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Toy 联机工具</h1>
  <p class="sub">给 B站 玩具提供跨玩具的统一用户身份。</p>

  <div id="dbg" hidden
       style="background:#fff3cd;border:1px solid #ffe69c;color:#664d03;
              border-radius:10px;padding:12px 14px;font-size:12px;
              line-height:1.8;margin-bottom:14px;word-break:break-all"></div>

  <a class="card" href="claim.html">
    <span class="arrow">›</span>
    <h2>认领我的玩具</h2>
    <span>玩具作者在这里登记，拿到 client_id 后即可接入</span>
  </a>

  <div class="card" style="background:#f6f7f8;box-shadow:none;cursor:default">
    <h2 style="margin-bottom:4px">过桥授权</h2>
    <span style="font-size:13px;color:#61666d">
      这一页不能直接打开 —— 必须由游戏里的「开启联机」按钮带参数跳过来。
      直接点开只会提示缺少参数。
    </span>
  </div>

  <div class="foot">
    接入方式：在玩具里引入 <code>xmeta-client.js</code>，配置 <code>clientId</code>，
    在按钮点击里调用 <code>XMETA.login()</code>。<br>
    详细说明见仓库 README。
  </div>
</div>

<script>
// 诊断用：没收到 cid 说明参数在跳转过程中丢了，页面只能停在首页。
// 把实际收到的地址显示出来，好判断是丢在哪一环。
if (!window.__XMETA_HAD_CID__) {
  var el = document.getElementById('dbg')
  if (el) {
    var esc = function (s) {
      return String(s).replace(/[<>&]/g, function (c) {
        return { '<': '&lt;', '>': '&gt;', '&': '&amp;' }[c]
      })
    }
    var diag = null
    try { diag = localStorage.getItem('xmeta:diag') } catch (e) {}

    el.hidden = false
    el.innerHTML =
      '<b>诊断：这个页面没有收到 cid 参数</b><br>' +
      '所以没能进入过桥流程，只能停在首页。<br><br>' +
      '<b>① 实际收到的地址</b><br><code>' + esc(location.href) + '</code><br><br>' +
      '<b>② 上一个玩具说要带的参数</b><br><code>' +
      (diag ? esc(diag) : '（读不到 —— 要么上一页根本没点按钮，要么它没写进来）') +
      '</code><br><br>' +
      '把这两段一起发给开发者。'
  }
}
</script>
</body>
</html>
