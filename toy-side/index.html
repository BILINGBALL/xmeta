<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Toy 联机工具</title>
<link rel="stylesheet" href="https://www.oxth.com:8443/xmeta-ui.css">
<script>
// 第三方玩具用 toy.navigate 跳过来时落点固定是 index.html。
// 参数优先取 URL（Web 端 SDK 会把 extra 拼进去），拿不到时回落到
// localStorage（App 内不透传 extra，发起方会把参数另写一份）。
window.__XMETA_HAD_CID__ = false
;(function () {
  var qs = new URLSearchParams(location.search)
  if (qs.get('cid')) {
    window.__XMETA_HAD_CID__ = true
    location.replace('bridge.html?' + location.search.slice(1))
    return
  }
  try {
    var req = JSON.parse(localStorage.getItem('xmeta:req') || 'null')
    if (req && req.cid && req.ts && Date.now() - req.ts < 3 * 60 * 1000) {
      window.__XMETA_HAD_CID__ = true
      location.replace('bridge.html')
    }
  } catch (e) { /* 忽略 */ }
})()
</script>
</head>
<body class="xm">
<div class="xm-page xm-page--center">

  <div class="xm-hero">
    <div class="xm-hero__ring xm-hero__ring--empty" style="font-size:26px">x</div>
    <h1 class="xm-hero__name">Toy 联机工具</h1>
    <p class="xm-hero__ask">让玩家在不同玩具里是同一个玩家</p>
  </div>

  <div class="xm-actions xm-mt-lg" style="margin-top:32px">
    <a class="xm-btn xm-btn--primary" href="claim.html">认领我的玩具</a>
    <a class="xm-btn xm-btn--ghost" href="me.html">查看我的身份</a>
  </div>

  <p class="xm-small xm-mt" style="text-align:center">
    过桥授权页不能直接打开，它由游戏里的「开启联机」按钮带参数跳过来。
  </p>

  <div class="xm-foot">
    <span class="xm-brand"><span class="xm-brand__dot"></span>xmeta 身份服务</span>
  </div>

  <!-- 开发诊断：只在参数丢失时出现 -->
  <div id="dbg" class="xm-alert xm-alert--warn xm-hidden"></div>
</div>

<script>
if (!window.__XMETA_HAD_CID__) {
  var el = document.getElementById('dbg')
  if (el) {
    var esc = function (s) {
      return String(s).replace(/[<>&]/g, function (c) {
        return { '<': '&lt;', '>': '&gt;', '&': '&amp;' }[c]
      })
    }
    var req = null
    try { req = localStorage.getItem('xmeta:req') } catch (e) {}

    el.classList.remove('xm-hidden')
    el.style.marginTop = '24px'
    el.innerHTML =
      '<b>诊断：没能进入过桥流程</b><br>' +
      'URL 和 localStorage 两条通道都没拿到参数。<br><br>' +
      '<b>收到的地址</b><br><code>' + esc(location.href) + '</code><br><br>' +
      '<b>发起方写的请求</b><br><code>' +
      (req ? esc(req) : '（读不到 —— 要么上一页没点按钮，要么跨 toy 共享失败）') +
      '</code>'
  }
}
</script>
</body>
</html>
