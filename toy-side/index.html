<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>xmeta · 联机身份服务</title>
<link rel="stylesheet" href="xmeta-ui.css">
<script>
// 第三方 toy 用 toy.navigate 跳过来时落点固定是 index.html。
// 参数优先取 URL（Web 端 SDK 会把 extra 拼进去），拿不到时回落到
// localStorage（App 内不透传 extra，发起方会把参数另写一份）。
;(function () {
  var qs = new URLSearchParams(location.search)
  if (qs.get('cid')) {
    location.replace('bridge.html?' + location.search.slice(1))
    return
  }
  try {
    var req = JSON.parse(localStorage.getItem('xmeta:req') || 'null')
    // claimed 的不能再转发：那是中心 toy 已经接手过的旧请求。
    if (req && req.cid && !req.claimed && req.ts && Date.now() - req.ts < 3 * 60 * 1000) {
      location.replace('bridge.html')
    }
  } catch (e) { /* 忽略 */ }
})()
</script>
</head>
<body class="xm xm--with-nav">
<div class="xm-page xm-page--center">

  <div class="xm-hero xm-rise">
    <div class="xm-brandmark" aria-hidden="true">
      <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 12 L28 28" stroke="#fff" stroke-width="4.5" stroke-linecap="round"/>
        <path d="M28 12 L12 28" stroke="#fff" stroke-width="4.5" stroke-linecap="round" opacity=".82"/>
        <circle cx="20" cy="20" r="2.6" fill="#fff"/>
      </svg>
    </div>
    <p class="xm-kicker xm-mt-lg">xmeta</p>
    <h1 class="xm-hero__name">为每个 toy<br>提供独立联机身份</h1>
    <p class="xm-hero__ask">各 toy 数据隔离，凭证由中心统一签发。</p>
  </div>

  <div class="xm-actions xm-rise xm-rise--2">
    <a class="xm-btn xm-btn--primary" href="claim.html">认领我的 toy</a>
    <a class="xm-btn xm-btn--ghost" href="me.html">查看我的身份</a>
  </div>

  <div class="xm-card xm-card--quiet xm-mt-lg xm-rise xm-rise--3">
    <div class="xm-facts">
      <div class="xm-fact">
        <span class="xm-fact__k">我是作者</span>
        <span class="xm-fact__v">认领 toy，拿到 client_id，给你的 toy 接入联机身份</span>
      </div>
      <div class="xm-fact">
        <span class="xm-fact__k">我是玩家</span>
        <span class="xm-fact__v">在接入的 toy 里点「开启联机」，跳到这里完成一次授权</span>
      </div>
    </div>
  </div>

  <div class="xm-foot">
    <span class="xm-brand"><span class="xm-brand__dot"></span>xmeta 联机身份服务</span>
  </div>

</div>

<!-- 底部导航 -->
<nav class="xm-bottomnav">
  <a class="xm-bottomnav__item is-active" href="index.html">
    <svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20h14V9.5"/></svg>
    <span>首页</span>
  </a>
  <a class="xm-bottomnav__item" href="me.html">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
    <span>身份</span>
  </a>
  <a class="xm-bottomnav__item" href="claim.html">
    <svg viewBox="0 0 24 24"><path d="M12 2v20"/><path d="M2 12h20"/></svg>
    <span>认领</span>
  </a>
</nav>
</body>
</html>
